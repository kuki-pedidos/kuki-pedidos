<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;

    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    height:290px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:20px}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:23px;
    letter-spacing:.4px;
    margin-bottom:8px;
    text-align:center;
}

.desc{
    color:var(--muted);
    min-height:44px;
    font-size:14px;
    line-height:1.45;
    margin-bottom:14px;
    text-align:center;
}

.price{
    color:var(--brown);
    font-size:24px;
    font-weight:900;
    margin-bottom:16px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

/* Feedback visual ao adicionar produto */
@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.cart-added-shake{
    animation:shake .45s ease;
}

.toast{
    position:fixed;
    left:50%;
    top:88px;
    transform:translateX(-50%) translateY(-20px);
    z-index:3000;
    background:var(--wine);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 12px 28px rgba(80,35,20,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

    .hero{padding:32px 15px 14px}

    .photo{height:185px}

    .info{padding:11px}

    .desc{font-size:11px;min-height:48px;margin-bottom:8px}

    .modal{padding:20px}

<script>
// HORÁRIOS DA LOJA
// A fonte oficial agora é a tabela HORARIOS do Supabase.
// O site consulta o n8n, que lê essa tabela.
const HORARIOS_WEBHOOK_URL =
    "https://rikasolucoes.app.n8n.cloud/webhook/kuki-horarios";

let storeHours = null;
let storeHoursLoaded = false;
let storeHoursLoading = false;

const DAY_TO_NAME = {
    0:"DOMINGO",
    1:"SEGUNDA",
    2:"TERÇA",
    3:"QUARTA",
    4:"QUINTA",
    5:"SEXTA",
    6:"SÁBADO"
};

function normalizeDayName(value){
    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
}

function normalizeTime(value){
    if(value === undefined || value === null) return "";
    const match = String(value).match(/^(\d{1,2}):(\d{2})/);
    if(!match) return "";
    return String(match[1]).padStart(2,"0") + ":" + match[2];
}

function getMinutes(time){
    const normalized = normalizeTime(time);
    if(!normalized) return 0;
    const [hour, minute] = normalized.split(":").map(Number);
    return hour * 60 + minute;
}

function isOpenValue(value){
    return value === true ||
        value === 1 ||
        String(value || "").trim().toUpperCase() === "TRUE";
}

function getHoursRows(data){
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.horarios)) return data.horarios;
    if(data && Array.isArray(data.data)) return data.data;
    if(data && Array.isArray(data.body)) return data.body;
    return [];
}

function setStoreHours(data){
    const rows = getHoursRows(data);
    const map = {};

    rows.forEach(function(row){
        const dayName = normalizeDayName(
            row.DIA_SEMANA ?? row.dia_semana ?? row.dia
        );

        if(!dayName) return;

        map[dayName] = {
            aberto:isOpenValue(row.ABERTO ?? row.aberto),
            abertura:normalizeTime(row.HORA_ABERTURA ?? row.hora_abertura),
            fechamento:normalizeTime(row.HORA_FECHAMENTO ?? row.hora_fechamento)
        };
    });

    storeHours = map;
    storeHoursLoaded = Object.keys(map).length > 0;
    return storeHoursLoaded;
}

async function loadStoreHours(){
    if(storeHoursLoading) return;

    storeHoursLoading = true;

    try{
        const response = await fetch(HORARIOS_WEBHOOK_URL,{
            method:"GET",
            headers:{"Accept":"application/json"}
        });

        if(!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();

        if(!setStoreHours(data)){
            throw new Error("Nenhum horário válido retornado.");
        }
    }catch(error){
        console.error("Erro ao carregar horários da loja:", error);
        storeHoursLoaded = false;
    }finally{
        storeHoursLoading = false;
        updateStoreStatus();
    }
}

function getStoreState(){
    if(!storeHoursLoaded || !storeHours){
        return {
            open:false,
            loading:storeHoursLoading,
            message:storeHoursLoading
                ? "⏳ Consultando os horários da KUKI..."
                : "🔴 Não foi possível consultar os horários da loja no momento."
        };
    }

    const now = new Date();
    const dayName = normalizeDayName(DAY_TO_NAME[now.getDay()]);
    const schedule = storeHours[dayName];

    if(!schedule || !schedule.aberto){
        return {
            open:false,
            message:"🔴 Hoje a KUKI está fechada."
        };
    }

    if(!schedule.abertura || !schedule.fechamento){
        return {
            open:false,
            message:"🔴 Os horários de hoje ainda não estão configurados."
        };
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const opening = getMinutes(schedule.abertura);
    const closing = getMinutes(schedule.fechamento);
    const isOpen = current >= opening && current < closing;

    return {
        open:isOpen,
        message:isOpen
            ? `🟢 Estamos abertos até ${schedule.fechamento} hs`
            : `🔴 Estamos fechados no momento. Funcionamos hoje das ${schedule.abertura} hs às ${schedule.fechamento} hs.`
    };
}

function updateStoreStatus(){
    const state = getStoreState();
    const element = document.getElementById("storeStatus");

let customerLookupTimer = null;
let lastCustomerLookupPhone = "";
let customerLookupInProgress = false;

function firstValue(obj, keys){
    if(!obj || typeof obj !== "object") return "";
    for(const key of keys){
        if(obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ""){
            return obj[key];
        }
    }
    return "";
}

function unwrapCustomerLookup(data){
    if(Array.isArray(data)) return data[0] || null;
    if(data && Array.isArray(data.data)) return data.data[0] || data;
    if(data && Array.isArray(data.clientes)) return data.clientes[0] || data;
    if(data && data.cliente) return data;
    return data || null;
}

function fillCustomerData(data){
    const payload = unwrapCustomerLookup(data);
    if(!payload || payload.encontrado === false || payload.found === false) return false;

    const customer = payload.cliente && typeof payload.cliente === "object"
        ? payload.cliente
        : payload;

    const name = firstValue(customer, ["NOME","nome"]);
    const cep = firstValue(customer, ["CEP","cep"]);
    const address = firstValue(customer, ["ENDERECO","endereco","LOGRADOURO","logradouro"]);
    const number = firstValue(customer, ["NUMERO","numero"]);
    const neighborhood = firstValue(customer, ["BAIRRO","bairro"]);
    const city = firstValue(customer, ["CIDADE","cidade"]);
    const observation = firstValue(customer, ["OBSERVACAO_CLIENTE","OBSERVACAO","observacao"]);

    const payment =
        firstValue(payload, ["ULTIMA_FORMA_PAGAMENTO","ultima_forma_pagamento","FORMA_PAGAMENTO","forma_pagamento","PAGAMENTO","pagamento"]) ||
        firstValue(customer, ["ULTIMA_FORMA_PAGAMENTO","ultima_forma_pagamento"]);

    if(name) document.getElementById("name").value = name;
    if(cep) document.getElementById("cep").value = formatCep(cep);
    if(address) document.getElementById("address").value = address;
    if(number) document.getElementById("number").value = number;
    if(neighborhood) document.getElementById("neighborhood").value = neighborhood;
    if(city) document.getElementById("city").value = city;
    if(observation) document.getElementById("observation").value = observation;

    if(payment){
        const paymentSelect = document.getElementById("payment");
        const normalized = String(payment).trim().toUpperCase();
        const aliases = {
            "CARTÃO":"CARTAO",
            "CARTAO":"CARTAO",
            "DINHEIRO":"DINHEIRO",
            "PIX":"PIX"
        };
        paymentSelect.value = aliases[normalized] || normalized;
    }

    return true;
}

async function lookupCustomerByPhone(){
    const phoneInput = document.getElementById("phone");
    if(!phoneInput) return;

    const rawPhone = phoneInput.value.trim();
    if(!rawPhone || !isValidPhone(rawPhone)) return;

    const phone = normalizePhoneForOrder(rawPhone);
    if(customerLookupInProgress || phone === lastCustomerLookupPhone) return;

    customerLookupInProgress = true;
    phoneInput.classList.add("customer-loading");

    try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        const url = new URL(SUPABASE_URL + "/rest/v1/" + CLIENTS_TABLE);
        url.searchParams.set("select", "*");
        url.searchParams.set("TELEFONE", "eq." + phone);
        url.searchParams.set("limit", "1");

        const response = await fetch(url.toString(),{
            method:"GET",
            signal:controller.signal,
            headers:{
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                "Accept": "application/json"
            }
        });

        clearTimeout(timeout);

        if(!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const found = fillCustomerData(data);

        // Guarda o telefone consultado mesmo quando o cliente ainda não existe,
        // evitando consultas repetidas enquanto o campo não for alterado.
        lastCustomerLookupPhone = phone;

        if(found){
            localStorage.setItem("kuki_whatsapp", phone);
        }
    }catch(error){
        console.warn("Não foi possível consultar o cadastro agora:", error);
    }finally{
        customerLookupInProgress = false;
        phoneInput.classList.remove("customer-loading");
    }
}
function scheduleCustomerLookup(){
    clearTimeout(customerLookupTimer);
    customerLookupTimer = setTimeout(lookupCustomerByPhone, 700);
}

function formatCep(value){
    const digits = String(value || "").replace(/\D/g,"").slice(0,8);
    if(digits.length > 5){
        return digits.slice(0,5) + "-" + digits.slice(5);
    }
    return digits;
}

async function searchCep(){
    const cepInput = document.getElementById("cep");
    const cep = String(cepInput.value || "").replace(/\D/g,"");

    if(cep.length !== 8) return;

    const address = document.getElementById("address");
    const neighborhood = document.getElementById("neighborhood");
    const city = document.getElementById("city");

    try{
        cepInput.disabled = true;

        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        if(!response.ok){
            throw new Error("Falha ao consultar CEP");
        }

        const data = await response.json();

        if(data.erro){
            alert("CEP não encontrado. Confira o número informado.");
            cepInput.focus();
            return;
        }

        address.value = data.logradouro || "";
        neighborhood.value = data.bairro || "";
        city.value = data.localidade || "";

        // Campos continuam editáveis caso o cliente precise corrigir/complementar.
        if(!address.value){
            address.focus();
        }else{
            document.getElementById("number").focus();
        }

    }catch(error){
        console.error("Erro ao buscar CEP:", error);
        alert("Não foi possível consultar o CEP agora. Você pode preencher o endereço manualmente.");
    }finally{
        cepInput.disabled = false;
    }
}

const SECURITY = {
    ORDER_COOLDOWN_MS: 8000,          // evita repetição acidental/spam imediato
    MAX_NAME_LENGTH: 80,
    MAX_TEXT_LENGTH: 300,
    MAX_ADDRESS_LENGTH: 120,
    MAX_CART_QUANTITY_PER_ITEM: 30,
    MAX_CART_ITEMS: 20,
    MAX_ORDER_TOTAL: 5000
};

let lastOrderAttemptAt = 0;

function sanitizeText(value, maxLength){
    return String(value ?? "")
        .replace(/[\u0000-\u001F\u007F]/g, " ")
        .replace(/[<>]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, maxLength);
}

function sanitizeDigits(value, maxLength){
    return String(value ?? "")
        .replace(/\D/g, "")
        .slice(0, maxLength);
}

function safeNumber(value, fallback = 0){
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
}

function isSafeOrder(){
    const items = Object.values(cart || {});

    if(items.length === 0 || items.length > SECURITY.MAX_CART_ITEMS){
        return {ok:false, message:"Quantidade de itens inválida."};
    }

    for(const item of items){
        const quantity = safeNumber(item.quantity);
        const price = safeNumber(item.price);

        if(!Number.isInteger(quantity) || quantity < 1 ||
           quantity > SECURITY.MAX_CART_QUANTITY_PER_ITEM){
            return {ok:false, message:"Quantidade inválida no carrinho."};
        }

        if(price < 0 || price > SECURITY.MAX_ORDER_TOTAL){
            return {ok:false, message:"Preço inválido no pedido."};
        }
    }

    const total = safeNumber(calculateTotal());
    if(total <= 0 || total > SECURITY.MAX_ORDER_TOTAL){
        return {ok:false, message:"Valor total inválido."};
    }

    return {ok:true};
}

function isBotSubmission(){
    const hp = document.getElementById("website");
    return !!(hp && hp.value.trim());
}

function makeRequestId(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }
    return "kuki-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function cleanCheckoutFields(){
    const fields = {
        name: ["name", SECURITY.MAX_NAME_LENGTH],
        cep: ["cep", 8],
        address: ["address", SECURITY.MAX_ADDRESS_LENGTH],
        number: ["number", 15],
        neighborhood: ["neighborhood", 80],
        city: ["city", 80],
        observation: ["observation", SECURITY.MAX_TEXT_LENGTH]
    };

    const name = document.getElementById(fields.name[0]);
    if(name) name.value = sanitizeText(name.value, fields.name[1]);

    const cep = document.getElementById(fields.cep[0]);
    if(cep) cep.value = formatCep(sanitizeDigits(cep.value, fields.cep[1]));

    const address = document.getElementById(fields.address[0]);
    if(address) address.value = sanitizeText(address.value, fields.address[1]);

    const number = document.getElementById(fields.number[0]);
    if(number) number.value = sanitizeText(number.value, fields.number[1]);

    const neighborhood = document.getElementById(fields.neighborhood[0]);
    if(neighborhood) neighborhood.value = sanitizeText(neighborhood.value, fields.neighborhood[1]);

    const city = document.getElementById(fields.city[0]);
    if(city) city.value = sanitizeText(city.value, fields.city[1]);

    const observation = document.getElementById(fields.observation[0]);
    if(observation) observation.value = sanitizeText(observation.value, fields.observation[1]);
}

function addInputGuardRails(){
    const maxMap = {
        name: SECURITY.MAX_NAME_LENGTH,
        address: SECURITY.MAX_ADDRESS_LENGTH,
        number: 15,
        neighborhood: 80,
        city: 80,
        observation: SECURITY.MAX_TEXT_LENGTH

    // Honeypot: bloqueia envios automatizados simples.
    if(isBotSubmission()){
        console.warn("Envio bloqueado pelo guard rail anti-bot.");
        return;
    }

    // Cooldown contra clique repetido e spam local.

        alert("Aguarde alguns segundos antes de enviar novamente.");
        return;
    }

    const order = {

        entrega:delivery,
        cep:cep,
        endereco:address,
        numero:number,
        bairro:neighborhood,
        cidade:city,
        observacao:observation,
        total:calculateTotal(),
        data:new Date().toISOString()
    };

    const button = document.getElementById("finish");

    lastOrderAttemptAt = Date.now();
    button.disabled = true;
    button.textContent = "ENVIANDO PEDIDO...";

    try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        const response = await fetch(
            WEBHOOK_URL,
            {
                method:"POST",
                signal:controller.signal,
                headers:{
                    "Content-Type":"application/json",
                    "X-Requested-With":"KUKI-SITE"
                },
                body:JSON.stringify(order)
            }
        );

        clearTimeout(timeout);

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        localStorage.setItem("kuki_whatsapp", phone);

        alert(
            "Pedido enviado com sucesso! 🍪\n\n" +
            "Obrigado, " + name + "!"
        );

        cart = {};

        updateCart();
        closeCart();

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("cep").value = "";
        document.getElementById("payment").value = "";
        document.getElementById("delivery").value = "";
        document.getElementById("address").value = "";
        document.getElementById("number").value = "";
        document.getElementById("neighborhood").value = "";
        document.getElementById("city").value = "";
        document.getElementById("observation").value = "";

    }catch(error){
        console.error("Erro ao enviar pedido:",error);

        alert(
            "Não foi possível enviar o pedido.\n\n" +
            "Verifique sua conexão e tente novamente."
        );
    }finally{
        button.disabled = false;
        button.textContent = "FINALIZAR PEDIDO";
    }
}

renderProducts();
updateCart();
updateStoreStatus();
loadStoreHours();
setInterval(updateStoreStatus, 60000);
setInterval(loadStoreHours, 5 * 60 * 1000);
</script>

</body>
</html>
