<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;
    --cream-3:#f5d7bd;
    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    height:290px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:20px}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:23px;
    letter-spacing:.4px;
    margin-bottom:8px;
    text-align:center;
}

.desc{
    color:var(--muted);
    min-height:44px;
    font-size:14px;
    line-height:1.45;
    margin-bottom:14px;
    text-align:center;
}

.price{
    color:var(--brown);
    font-size:24px;
    font-weight:900;
    margin-bottom:16px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:620px){
    .header{padding:10px 14px}
    .brand img{width:135px}
    .cart-top{padding:11px 14px}
    .hero{padding:32px 15px 14px}
    .products{padding:10px 15px 55px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .photo{height:185px}
    .photo img{padding:2px}
    .info{padding:11px}
    .name{font-size:15px;margin-bottom:6px}
    .desc{font-size:11px;min-height:48px;margin-bottom:8px}
    .price{font-size:16px;margin-bottom:10px}
    .actions{gap:6px;flex-direction:column}
    .qty{justify-content:center}
    .qty button{width:34px;height:36px}
    .add{min-height:38px;font-size:12px}
    .row{grid-template-columns:1fr}
    .modal{padding:20px}
}
</style>
</head>

<body>

<header>
    <div class="header">
        <a class="brand" href="#" aria-label="KUKI">
            <img src="images/logo-kuki-transparente.png" alt="KUKI Cookies">
        </a>

        <button class="cart-top" type="button" onclick="openCart()">
            🛒 Faça seu pedido <span id="topCount">0</span>
        </button>
    </div>
</header>

<section class="hero">
    <h1>Faça seu pedido</h1>
    <p>Escolha seus cookies favoritos e monte seu pedido.</p>
</section>

<div id="storeStatus" class="store-status" role="status"></div>

<main class="products">
    <div class="grid" id="products"></div>
</main>

<div id="overlay" class="overlay" onclick="outside(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Meu pedido</h2>
            <button class="close" type="button" onclick="closeCart()">×</button>
        </div>

        <div id="items" class="items"></div>

        <div class="total">
            <span>Total</span>
            <span id="total">R$ 0,00</span>
        </div>

        <div class="form">
            <h3>Seus dados</h3>
            <div class="required-note">* Campos obrigatórios</div>

            <div class="group">
                <label for="name">Nome *</label>
                <input id="name" type="text" placeholder="Digite seu nome" autocomplete="name">
            </div>

            <div class="group">
                <label for="phone">WhatsApp *</label>
                <input id="phone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel">
            </div>

            <div class="group">
                <label for="payment">Forma de pagamento *</label>
                <select id="payment">
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="CARTAO">Cartão</option>
                </select>
            </div>

            <div class="group">
                <label for="delivery">Tipo de entrega *</label>
                <select id="delivery">
                    <option value="">Selecione</option>
                    <option value="ENTREGA">Entrega</option>
                    <option value="RETIRADA">Retirada</option>
                </select>
            </div>

            <div class="group">
                <label for="address">Endereço *</label>
                <input id="address" type="text" placeholder="Rua, avenida..." autocomplete="street-address">
            </div>

            <div class="row">
                <div class="group">
                    <label for="number">Número *</label>
                    <input id="number" type="text" placeholder="Número">
                </div>

                <div class="group">
                    <label for="neighborhood">Bairro *</label>
                    <input id="neighborhood" type="text" placeholder="Bairro">
                </div>
            </div>

            <div class="group">
                <label for="city">Cidade</label>
                <input id="city" type="text" placeholder="Digite sua cidade" autocomplete="address-level2">
            </div>

            <div class="group">
                <label for="observation">Observação</label>
                <textarea id="observation" rows="3" placeholder="Alguma observação?"></textarea>
            </div>

            <button id="finish" class="finish" type="button" onclick="finishOrder()">
                FINALIZAR PEDIDO
            </button>
        </div>
    </div>
</div>

<script>
// HORÁRIOS DA LOJA — altere apenas este bloco quando necessário.
// Dias: 0=domingo, 1=segunda, ... 6=sábado.
const STORE_HOURS = {
    0: { open: "11:30", close: "17:00" }, // Domingo
    1: { open: "13:30", close: "17:00" }, // Segunda
    2: { open: "13:30", close: "17:00" }, // Terça
    3: { open: "13:30", close: "17:00" }, // Quarta
    4: { open: "13:30", close: "17:00" }, // Quinta
    5: { open: "13:30", close: "17:00" }, // Sexta
    6: { open: "13:30", close: "17:00" }  // Sábado
};

function getMinutes(time){
    const [hour, minute] = time.split(":").map(Number);
    return hour * 60 + minute;
}

function getStoreState(){
    const now = new Date();
    const schedule = STORE_HOURS[now.getDay()];

    if(!schedule){
        return { open:false, message:"Hoje a KUKI está fechada." };
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const opening = getMinutes(schedule.open);
    const closing = getMinutes(schedule.close);
    const isOpen = current >= opening && current < closing;

    return {
        open:isOpen,
        message:isOpen
            ? `🟢 Estamos abertos até ${schedule.close} hs`
            : `🔴 Estamos fechados no momento. Funcionamos hoje das ${schedule.open} às ${schedule.close}.`
    };
}

function updateStoreStatus(){
    const state = getStoreState();
    const element = document.getElementById("storeStatus");
    if(!element) return state;
    element.textContent = state.message;
    element.className = "store-status " + (state.open ? "open" : "closed");
    return state;
}

const WEBHOOK_URL =
    "https://rikasolucoes.app.n8n.cloud/webhook/kuki-pedido-site";

const products = [
    {
        id: "1",
        name: "TRADICIONAL",
        price: 10.90,
        desc: "Chocolate ao leite e gotas de chocolate",
        image: "images/tradicional.png",
        active: true
    },
    {
        id: "2",
        name: "RED",
        price: 13.90,
        desc: "Massa vermelha com muito chocolate branco",
        image: "images/red.png",
        active: true
    },
    {
        id: "3",
        name: "BLACK",
        price: 13.90,
        desc: "Massa 100% cacau com chocolate branco e chocolate ao leite",
        image: "images/black.png",
        active: true
    },
    {
        id: "4",
        name: "NUTELLA",
        price: 15.90,
        desc: "Massa tradicional com muito recheio de Nutella",
        image: "images/nutella.png",
        active: true
    },
    {
        id: "5",
        name: "BUENO",
        price: 17.90,
        desc: "Cookie com recheio cremoso e o delicioso sabor bueno",
        image: "images/bueno.png",
        active: true
    },
    {
        id: "6",
        name: "CREAM",
        price: 15.90,
        desc: "Cookie com recheio cremoso e sabor irresistível",
        image: "images/cream.png",
        active: true
    }
];

let cart = {};

function money(value) {
    return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function renderProducts() {
    const activeProducts =
        products.filter(function(item) {
            return item.active;
        });

    document.getElementById("products").innerHTML =
        activeProducts.map(function(product) {
            return `
                <div class="card">
                    <div class="photo">
                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy">
                    </div>

                    <div class="info">
                        <div class="name">${product.name}</div>
                        <div class="desc">${product.desc}</div>
                        <div class="price">${money(product.price)}</div>

                        <div class="actions">
                            <div class="qty">
                                <button type="button" onclick="changeQty('${product.id}',-1)">−</button>
                                <span id="q${product.id}">0</span>
                                <button type="button" onclick="changeQty('${product.id}',1)">+</button>
                            </div>

                            <button
                                type="button"
                                class="add"
                                onclick="add('${product.id}')">
                                ADICIONAR
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join("");
}

function changeQty(id, amount) {
    const element = document.getElementById("q" + id);
    let value = parseInt(element.textContent,10) || 0;

    value += amount;

    if(value < 0) value = 0;

    element.textContent = value;
}

function add(id) {
    const quantity =
        parseInt(
            document.getElementById("q" + id).textContent,
            10
        ) || 0;

    if(quantity <= 0){
        alert("Escolha pelo menos 1 unidade.");
        return;
    }

    const product =
        products.find(function(item){
            return item.id === id;
        });

    if(!product){
        alert("Produto não encontrado.");
        return;
    }

    if(!cart[id]){
        cart[id] = {
            ...product,
            quantity: 0
        };
    }

    cart[id].quantity += quantity;

    document.getElementById("q" + id).textContent = 0;

    updateCart();
}

function changeCart(id, amount) {
    if(!cart[id]) return;

    cart[id].quantity += amount;

    if(cart[id].quantity <= 0){
        delete cart[id];
    }

    updateCart();
}

function removeItem(id){
    delete cart[id];
    updateCart();
}

function calculateTotal(){
    return Object.values(cart).reduce(
        function(total,item){
            return total + item.price * item.quantity;
        },
        0
    );
}

function calculateCount(){
    return Object.values(cart).reduce(
        function(total,item){
            return total + item.quantity;
        },
        0
    );
}

function updateCart(){
    const container = document.getElementById("items");
    const ids = Object.keys(cart);

    if(ids.length === 0){
        container.innerHTML =
            '<div class="empty">Seu pedido está vazio.</div>';
    }else{
        container.innerHTML =
            ids.map(function(id){
                const item = cart[id];
                const subtotal = item.price * item.quantity;

                return `
                    <div class="item">
                        <div>
                            <div class="itemname">${item.name}</div>
                            <div class="itemprice">
                                ${item.quantity} x ${money(item.price)}
                                = ${money(subtotal)}
                            </div>
                        </div>

                        <div class="controls">
                            <button type="button" onclick="changeCart('${id}',-1)">−</button>
                            <strong>${item.quantity}</strong>
                            <button type="button" onclick="changeCart('${id}',1)">+</button>
                            <button type="button" class="remove" onclick="removeItem('${id}')">🗑</button>
                        </div>
                    </div>
                `;
            }).join("");
    }

    document.getElementById("total").textContent = money(calculateTotal());
    document.getElementById("topCount").textContent = calculateCount();
}

function openCart(){
    document.getElementById("overlay").classList.add("active");
    updateCart();
}

function closeCart(){
    document.getElementById("overlay").classList.remove("active");
}

function outside(event){
    if(event.target.id === "overlay"){
        closeCart();
    }
}

function normalizePhone(phone){
    return String(phone || "").replace(/\D/g,"");
}

function normalizePhoneForOrder(phone){
    const digits = normalizePhone(phone);

    if(
        digits.startsWith("55") &&
        (digits.length === 12 || digits.length === 13)
    ){
        return digits.substring(2);
    }

    return digits;
}

function isValidPhone(phone){
    const digits = normalizePhone(phone);

    return (
        digits.length === 10 ||
        digits.length === 11 ||
        (
            digits.startsWith("55") &&
            (digits.length === 12 || digits.length === 13)
        )
    );
}

async function finishOrder(){
    const storeState = getStoreState();
    if(!storeState.open){
        alert("A KUKI está fechada no momento. Não é possível finalizar pedidos agora.");
        return;
    }

    if(Object.keys(cart).length === 0){
        alert("Adicione pelo menos um produto ao pedido.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const phoneInput = document.getElementById("phone").value.trim();
    const payment = document.getElementById("payment").value.trim();
    const delivery = document.getElementById("delivery").value.trim();
    const address = document.getElementById("address").value.trim();
    const number = document.getElementById("number").value.trim();
    const neighborhood = document.getElementById("neighborhood").value.trim();
    const city = document.getElementById("city").value.trim();
    const observation = document.getElementById("observation").value.trim();

    if(!name){
        alert("Digite seu nome.");
        document.getElementById("name").focus();
        return;
    }

    if(!phoneInput){
        alert("Digite seu WhatsApp.");
        document.getElementById("phone").focus();
        return;
    }

    if(!isValidPhone(phoneInput)){
        alert("Digite um WhatsApp válido.");
        document.getElementById("phone").focus();
        return;
    }

    const phone = normalizePhoneForOrder(phoneInput);

    if(!payment){
        alert("Selecione a forma de pagamento.");
        document.getElementById("payment").focus();
        return;
    }

    if(!delivery){
        alert("Selecione o tipo de entrega.");
        document.getElementById("delivery").focus();
        return;
    }

    if(!address){
        alert("Digite o endereço.");
        document.getElementById("address").focus();
        return;
    }

    if(!number){
        alert("Digite o número.");
        document.getElementById("number").focus();
        return;
    }

    if(!neighborhood){
        alert("Digite o bairro.");
        document.getElementById("neighborhood").focus();
        return;
    }

    const order = {
        origem: "SITE_KUKI",

        cliente:{
            nome:name,
            whatsapp:phone
        },

        itens:Object.values(cart).map(function(item){
            return {
                produto_id:item.id,
                produto:item.name,
                quantidade:item.quantity,
                preco_unitario:item.price,
                valor_item:item.price * item.quantity
            };
        }),

        pagamento:payment,
        entrega:delivery,
        endereco:address,
        numero:number,
        bairro:neighborhood,
        cidade:city,
        observacao:observation,
        total:calculateTotal(),
        data:new Date().toISOString()
    };

    const button = document.getElementById("finish");

    button.disabled = true;
    button.textContent = "ENVIANDO PEDIDO...";

    try{
        const response = await fetch(
            WEBHOOK_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(order)
            }
        );

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        alert(
            "Pedido enviado com sucesso! 🍪\n\n" +
            "Obrigado, " + name + "!"
        );

        cart = {};

        updateCart();
        closeCart();

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("payment").value = "";
        document.getElementById("delivery").value = "";
        document.getElementById("address").value = "";
        document.getElementById("number").value = "";
        document.getElementById("neighborhood").value = "";
        document.getElementById("city").value = "";
        document.getElementById("observation").value = "";

    }catch(error){
        console.error("Erro ao enviar pedido:",error);

        alert(
            "Não foi possível enviar o pedido.\n\n" +
            "Verifique sua conexão e tente novamente."
        );
    }finally{
        button.disabled = false;
        button.textContent = "FINALIZAR PEDIDO";
    }
}

renderProducts();
updateCart();
updateStoreStatus();
setInterval(updateStoreStatus, 60000);
</script>
