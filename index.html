<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8f1e9;
    color: #241713;
}

header {
    background: #fff;
    border-bottom: 1px solid #eadbd0;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header {
    max-width: 1200px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cookie {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #d69b69;
    border: 4px solid #c88655;
    position: relative;
    flex: 0 0 auto;
}

.cookie:before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #573326;
    top: 9px;
    left: 9px;
    box-shadow:
        18px 3px #573326,
        7px 18px #573326,
        25px 21px #573326;
}

.cookie:after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #573326;
    top: 30px;
    left: 16px;
    box-shadow: 15px -12px #573326;
}

.logo strong {
    display: block;
    font-size: 25px;
    letter-spacing: 2px;
}

.logo span {
    font-size: 13px;
    color: #756a65;
}

button {
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.cart-top,
.add,
.finish {
    background: #321c14;
    color: #fff;
    border: 0;
}

.cart-top {
    padding: 12px 20px;
    border-radius: 30px;
    white-space: nowrap;
}

.hero {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px 20px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.hero p {
    color: #756a65;
}

.products {
    max-width: 1200px;
    margin: auto;
    padding: 10px 20px 80px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: #fff;
    border: 1px solid #eadbd0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(60,30,15,.06);
}

.photo {
    height: 220px;
    background: #f0e1d1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
    display: block;
}

.info {
    padding: 20px;
}

.name {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
}

.desc {
    color: #756a65;
    font-size: 14px;
    line-height: 1.45;
    min-height: 42px;
    margin-bottom: 15px;
}

.price {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 15px;
}

.actions {
    display: flex;
    gap: 8px;
}

.qty {
    display: flex;
    align-items: center;
    border: 1px solid #eadbd0;
    border-radius: 10px;
    overflow: hidden;
}

.qty button {
    width: 40px;
    height: 44px;
    border: 0;
    background: #fff;
    font-size: 20px;
}

.qty span {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

.add {
    flex: 1;
    border-radius: 10px;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.overlay.active {
    display: flex;
}

.modal {
    background: #fff;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 25px;
}

.modalhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close {
    border: 0;
    background: #f4eee9;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 20px;
}

.items {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #756a65;
}

.item {
    border: 1px solid #eadbd0;
    border-radius: 14px;
    padding: 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
}

.itemname {
    font-weight: bold;
}

.itemprice {
    color: #756a65;
    font-size: 14px;
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.controls button {
    border: 1px solid #eadbd0;
    background: #fff;
    width: 30px;
    height: 30px;
    border-radius: 7px;
}

.remove {
    color: #a33 !important;
    border: 0 !important;
}

.total {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eadbd0;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
}

.form {
    margin-top: 25px;
}

.form h3 {
    margin-bottom: 4px;
}

.required-note {
    color: #756a65;
    font-size: 12px;
    margin-bottom: 15px;
}

.group {
    margin-bottom: 13px;
}

.group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.group input,
.group textarea,
.group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #eadbd0;
    border-radius: 9px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    background: #fff;
}

.group input:focus,
.group textarea:focus,
.group select:focus {
    outline: none;
    border-color: #321c14;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.finish {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
}

.finish:disabled {
    opacity: .6;
    cursor: wait;
}

@media(max-width:850px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero h1 {
        font-size: 32px;
    }
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 28px;
    }

    .products {
        padding: 10px 15px 70px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 12px 15px;
    }

    .logo strong {
        font-size: 22px;
    }

    .logo span {
        font-size: 12px;
    }

    .cart-top {
        padding: 10px 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">
            <div class="cookie"></div>
            <div>
                <strong>KUKI</strong>
                <span>Cookies Artesanais</span>
            </div>
        </div>

        <!-- ÚNICO botão do carrinho -->
        <button class="cart-top" type="button" onclick="openCart()">
            🛒 Meu pedido
            <span id="topCount">0</span>
        </button>
    </div>
</header>

<section class="hero">
    <h1>Faça seu pedido 🍪</h1>
    <p>Escolha seus cookies favoritos e monte seu pedido.</p>
</section>

<main class="products">
    <div class="grid" id="products"></div>
</main>

<div id="overlay" class="overlay" onclick="outside(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Meu pedido</h2>

            <button
                class="close"
                type="button"
                onclick="closeCart()">
                ×
            </button>
        </div>

        <div id="items" class="items"></div>

        <div class="total">
            <span>Total</span>
            <span id="total">R$ 0,00</span>
        </div>

        <div class="form">
            <h3>Seus dados</h3>
            <div class="required-note">* Campos obrigatórios</div>

            <div class="group">
                <label for="name">Nome *</label>
                <input
                    id="name"
                    type="text"
                    placeholder="Digite seu nome"
                    autocomplete="name">
            </div>

            <div class="group">
                <label for="phone">WhatsApp *</label>
                <input
                    id="phone"
                    type="tel"
                    placeholder="(85) 99999-9999"
                    inputmode="tel"
                    autocomplete="tel">
            </div>

            <div class="group">
                <label for="payment">Forma de pagamento *</label>
                <select id="payment">
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="CARTAO">Cartão</option>
                </select>
            </div>

            <div class="group">
                <label for="delivery">Tipo de entrega *</label>
                <select id="delivery">
                    <option value="">Selecione</option>
                    <option value="ENTREGA">Entrega</option>
                    <option value="RETIRADA">Retirada</option>
                </select>
            </div>

            <div class="group">
                <label for="address">Endereço *</label>
                <input
                    id="address"
                    type="text"
                    placeholder="Rua, avenida..."
                    autocomplete="street-address">
            </div>

            <div class="row">
                <div class="group">
                    <label for="number">Número *</label>
                    <input
                        id="number"
                        type="text"
                        placeholder="Número">
                </div>

                <div class="group">
                    <label for="neighborhood">Bairro *</label>
                    <input
                        id="neighborhood"
                        type="text"
                        placeholder="Bairro"
                        autocomplete="address-level3">
                </div>
            </div>

            <div class="group">
                <label for="observation">Observação</label>
                <textarea
                    id="observation"
                    rows="3"
                    placeholder="Alguma observação?"></textarea>
            </div>

            <button
                id="finish"
                class="finish"
                type="button"
                onclick="finishOrder()">
                FINALIZAR PEDIDO
            </button>
        </div>
    </div>
</div>

<script>
const WEBHOOK_URL =
    "https://rikasolucoes.app.n8n.cloud/webhook/kuki-pedido-site";

const products = [
    {
        id: "1",
        name: "TRADICIONAL",
        price: 10.90,
        desc: "Chocolate ao leite e gotas de chocolate.",
        image: "images/tradicional.jpg"
    },
    {
        id: "2",
        name: "RED",
        price: 13.90,
        desc: "Massa vermelha com muito chocolate branco.",
        image: "images/red.jpg"
    },
    {
        id: "3",
        name: "BLACK",
        price: 13.90,
        desc: "Massa 100% cacau com chocolate branco e ao leite.",
        image: "images/black.jpg"
    },
    {
        id: "4",
        name: "NUTELLA",
        price: 15.90,
        desc: "Massa tradicional com muito recheio de Nutella.",
        image: "images/nutella.jpg"
    },
    {
        id: "5",
        name: "BUENO",
        price: 17.90,
        desc: "Cookie com recheio cremoso e delicioso.",
        image: "images/bueno.jpg"
    },
    {
        id: "6",
        name: "CREAM",
        price: 15.90,
        desc: "Cookie com recheio cremoso e sabor irresistível.",
        image: "images/cream.jpg"
    }
];

let cart = {};

function money(value) {
    return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function renderProducts() {
    document.getElementById("products").innerHTML =
        products.map(function(product) {
            return `
                <div class="card">
                    <div class="photo"><img src="${product.image}" alt="${product.name}" loading="lazy"></div>

                    <div class="info">
                        <div class="name">${product.name}</div>

                        <div class="desc">${product.desc}</div>

                        <div class="price">${money(product.price)}</div>

                        <div class="actions">
                            <div class="qty">
                                <button
                                    type="button"
                                    onclick="changeQty('${product.id}', -1)">
                                    −
                                </button>

                                <span id="q${product.id}">0</span>

                                <button
                                    type="button"
                                    onclick="changeQty('${product.id}', 1)">
                                    +
                                </button>
                            </div>

                            <button
                                type="button"
                                class="add"
                                onclick="add('${product.id}')">
                                ADICIONAR
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join("");
}

function changeQty(id, amount) {
    const element =
        document.getElementById("q" + id);

    let value =
        parseInt(element.textContent, 10) || 0;

    value += amount;

    if (value < 0) {
        value = 0;
    }

    element.textContent = value;
}

function add(id) {
    const quantity =
        parseInt(
            document.getElementById("q" + id).textContent,
            10
        ) || 0;

    if (quantity <= 0) {
        alert("Escolha pelo menos 1 unidade.");
        return;
    }

    const product =
        products.find(function(item) {
            return item.id === id;
        });

    if (!product) {
        alert("Produto não encontrado.");
        return;
    }

    if (!cart[id]) {
        cart[id] = {
            ...product,
            quantity: 0
        };
    }

    cart[id].quantity += quantity;

    document.getElementById("q" + id).textContent = 0;

    updateCart();

    // Não abre o carrinho automaticamente.
    // O cliente pode continuar escolhendo outros produtos.
}

function changeCart(id, amount) {
    if (!cart[id]) {
        return;
    }

    cart[id].quantity += amount;

    if (cart[id].quantity <= 0) {
        delete cart[id];
    }

    updateCart();
}

function removeItem(id) {
    delete cart[id];
    updateCart();
}

function calculateTotal() {
    return Object.values(cart).reduce(
        function(total, item) {
            return total + (item.price * item.quantity);
        },
        0
    );
}

function calculateCount() {
    return Object.values(cart).reduce(
        function(total, item) {
            return total + item.quantity;
        },
        0
    );
}

function updateCart() {
    const container =
        document.getElementById("items");

    const ids =
        Object.keys(cart);

    if (ids.length === 0) {
        container.innerHTML =
            '<div class="empty">Seu pedido está vazio.</div>';
    } else {
        container.innerHTML =
            ids.map(function(id) {
                const item = cart[id];

                const subtotal =
                    item.price * item.quantity;

                return `
                    <div class="item">
                        <div>
                            <div class="itemname">${item.name}</div>

                            <div class="itemprice">
                                ${item.quantity} x
                                ${money(item.price)}
                                =
                                ${money(subtotal)}
                            </div>
                        </div>

                        <div class="controls">
                            <button
                                type="button"
                                onclick="changeCart('${id}', -1)">
                                −
                            </button>

                            <strong>${item.quantity}</strong>

                            <button
                                type="button"
                                onclick="changeCart('${id}', 1)">
                                +
                            </button>

                            <button
                                type="button"
                                class="remove"
                                onclick="removeItem('${id}')">
                                🗑
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
    }

    document.getElementById("total").textContent =
        money(calculateTotal());

    document.getElementById("topCount").textContent =
        calculateCount();
}

function openCart() {
    document
        .getElementById("overlay")
        .classList.add("active");

    updateCart();
}

function closeCart() {
    document
        .getElementById("overlay")
        .classList.remove("active");
}

function outside(event) {
    if (event.target.id === "overlay") {
        closeCart();
    }
}

function normalizePhone(phone) {
    return String(phone || "")
        .replace(/\D/g, "");
}

function normalizePhoneForOrder(phone) {
    const digits = normalizePhone(phone);

    if (
        digits.startsWith("55") &&
        (digits.length === 12 || digits.length === 13)
    ) {
        return digits.substring(2);
    }

    return digits;
}

function isValidPhone(phone) {
    const digits =
        normalizePhone(phone);

    return (
        digits.length === 10 ||
        digits.length === 11 ||
        (
            digits.startsWith("55") &&
            (digits.length === 12 || digits.length === 13)
        )
    );
}

async function finishOrder() {
    if (Object.keys(cart).length === 0) {
        alert("Adicione pelo menos um produto ao pedido.");
        return;
    }

    const name =
        document.getElementById("name").value.trim();

    const phoneInput =
        document.getElementById("phone").value.trim();

    const payment =
        document.getElementById("payment").value.trim();

    const delivery =
        document.getElementById("delivery").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const number =
        document.getElementById("number").value.trim();

    const neighborhood =
        document.getElementById("neighborhood").value.trim();

    const observation =
        document.getElementById("observation").value.trim();

    // =========================
    // VALIDAÇÕES
    // =========================

    if (!name) {
        alert("Digite seu nome.");
        document.getElementById("name").focus();
        return;
    }

    if (!phoneInput) {
        alert("Digite seu WhatsApp.");
        document.getElementById("phone").focus();
        return;
    }

    if (!isValidPhone(phoneInput)) {
        alert("Digite um WhatsApp válido.");
        document.getElementById("phone").focus();
        return;
    }

    // O n8n já acrescenta o DDI 55.
    // Portanto enviamos para o n8n o número nacional.
    const phone =
        normalizePhoneForOrder(phoneInput);

    if (!payment) {
        alert("Selecione a forma de pagamento.");
        document.getElementById("payment").focus();
        return;
    }

    if (!delivery) {
        alert("Selecione o tipo de entrega.");
        document.getElementById("delivery").focus();
        return;
    }

    if (!address) {
        alert("Digite o endereço.");
        document.getElementById("address").focus();
        return;
    }

    if (!number) {
        alert("Digite o número.");
        document.getElementById("number").focus();
        return;
    }

    if (!neighborhood) {
        alert("Digite o bairro.");
        document.getElementById("neighborhood").focus();
        return;
    }

    // =========================
    // PEDIDO
    // =========================

    const order = {
        origem: "SITE_KUKI",

        cliente: {
            nome: name,
            whatsapp: phone
        },

        itens: Object.values(cart).map(function(item) {
            return {
                produto_id: item.id,
                produto: item.name,
                quantidade: item.quantity,
                preco_unitario: item.price,
                valor_item:
                    item.price * item.quantity
            };
        }),

        pagamento: payment,
        entrega: delivery,
        endereco: address,
        numero: number,
        bairro: neighborhood,
        observacao: observation,
        total: calculateTotal(),
        data: new Date().toISOString()
    };

    const button =
        document.getElementById("finish");

    button.disabled = true;
    button.textContent =
        "ENVIANDO PEDIDO...";

    try {
        const response =
            await fetch(WEBHOOK_URL, {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(order)
            });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        alert(
            "Pedido enviado com sucesso! 🍪\n\n" +
            "Obrigado, " + name + "!"
        );

        cart = {};

        updateCart();
        closeCart();

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("payment").value = "";
        document.getElementById("delivery").value = "";
        document.getElementById("address").value = "";
        document.getElementById("number").value = "";
        document.getElementById("neighborhood").value = "";
        document.getElementById("observation").value = "";

    } catch (error) {
        console.error(
            "Erro ao enviar pedido:",
            error
        );

        alert(
            "Não foi possível enviar o pedido.\n\n" +
            "Verifique sua conexão e tente novamente."
        );

    } finally {
        button.disabled = false;
        button.textContent =
            "FINALIZAR PEDIDO";
    }
}

renderProducts();
updateCart();
</script>

</body>
</html>
