<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;
    --cream-3:#f5d7bd;
    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    height:290px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:20px}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:23px;
    letter-spacing:.4px;
    margin-bottom:8px;
    text-align:center;
}

.desc{
    color:var(--muted);
    min-height:44px;
    font-size:14px;
    line-height:1.45;
    margin-bottom:14px;
    text-align:center;
}

.price{
    color:var(--brown);
    font-size:24px;
    font-weight:900;
    margin-bottom:16px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

/* Feedback visual ao adicionar produto */
@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.cart-added-shake{
    animation:shake .45s ease;
}

.toast{
    position:fixed;
    left:50%;
    top:88px;
    transform:translateX(-50%) translateY(-20px);
    z-index:3000;
    background:var(--wine);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 12px 28px rgba(80,35,20,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:620px){
    .header{padding:10px 14px}
    .brand img{width:135px}
    .cart-top,.history-top{padding:11px 12px;font-size:12px}
    .header-actions{gap:6px}
    .hero{padding:32px 15px 14px}
    .products{padding:10px 15px 55px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .photo{height:185px}
    .photo img{padding:2px}
    .info{padding:11px}
    .name{font-size:15px;margin-bottom:6px}
    .desc{font-size:11px;min-height:48px;margin-bottom:8px}
    .price{font-size:16px;margin-bottom:10px}
    .actions{gap:6px;flex-direction:column}
    .qty{justify-content:center}
    .qty button{width:34px;height:36px}
    .add{min-height:38px;font-size:12px}
    .row{grid-template-columns:1fr}
    .modal{padding:20px}
}

/* RODAPÉ FIXO */
.site-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1500;
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(80,35,20,.10);
    padding:10px 22px;
}
.footer-content{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}
.history-float{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    background:var(--wine);
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(80,35,20,.20);
}
.history-float:hover{background:var(--wine-dark)}
.instagram-link{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--brown);
    font-size:15px;
    font-weight:800;
    text-decoration:none;
}
.instagram-link:hover{
    color:var(--wine);
}
.instagram-icon{
    width:24px;
    height:24px;
    flex:0 0 24px;
}
body{
    padding-bottom:76px;
}

.history-result{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.history-empty,.history-loading{
    padding:16px;
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--muted);
    text-align:center;
}
.order-history-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    background:#fff;
}
.order-history-head{
    margin-bottom:10px;
}
.order-history-number{
    color:var(--wine);
    font-weight:900;
    font-size:20px;
    letter-spacing:.4px;
}
.order-history-info{
    display:grid;
    gap:5px;
    color:var(--muted);
    font-size:15px;
    line-height:1.45;
}
.order-history-total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--cream-3);
    color:var(--brown);
    font-size:18px;
    font-weight:900;
}

@media(max-width:620px){
    .site-footer{
        padding:9px 12px;
    }
    .footer-content{
        gap:10px;
    }
    .history-float{
        padding:13px 14px;
        font-size:12px;
        white-space:nowrap;
    }
    .instagram-link{
        font-size:12px;
        gap:6px;
        white-space:nowrap;
    }
    .instagram-icon{
        width:21px;
        height:21px;
        flex-basis:21px;
    }
    body{
        padding-bottom:70px;
    }
}


/* GUARD RAILS DE SEGURANÇA */
.hp-field{
    position:absolute !important;
    left:-9999px !important;
    width:1px !important;
    height:1px !important;
    overflow:hidden !important;
    opacity:0 !important;
    pointer-events:none !important;
}
.security-note{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    line-height:1.35;
}

/* =====================================================
   EXPERIÊNCIA DE PEDIDO — RÁPIDA, CLARA E MODERNA
===================================================== */
:root{
    --shadow-soft:0 8px 24px rgba(80,35,20,.08);
    --shadow-strong:0 18px 38px rgba(80,35,20,.16);
}
body{letter-spacing:-.01em}
button,input,textarea,select{font-family:inherit}
button{transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:3px solid rgba(179,11,46,.22);
    outline-offset:3px;
}

header{box-shadow:0 2px 12px rgba(80,35,20,.04)}
.header{padding-top:14px;padding-bottom:14px}
.cart-top{min-height:46px;display:inline-flex;align-items:center;gap:7px}
.cart-top:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(179,11,46,.26)}
.hero{padding-top:52px;padding-bottom:22px}
.hero h1{letter-spacing:-.045em;line-height:1.04}
.hero p{line-height:1.5}
.product-search{
    width:min(100%,460px);height:48px;margin-top:22px;
    display:flex;align-items:center;gap:10px;padding:0 15px;
    border:1px solid var(--border);border-radius:14px;background:var(--white);
    box-shadow:0 5px 14px rgba(80,35,20,.05);color:var(--wine);
}
.product-search span{font-size:24px;font-weight:700;line-height:1}
.product-search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-weight:600}
.product-search:focus-within{border-color:var(--wine);box-shadow:0 0 0 3px rgba(179,11,46,.09)}

.grid{gap:20px}
.card{border-radius:18px;box-shadow:var(--shadow-soft)}
.card:hover{box-shadow:var(--shadow-strong)}
.photo{height:270px;background:linear-gradient(145deg,var(--cream-2),#fff8f1)}
.info{padding:18px}
.name{text-align:left;font-size:20px;letter-spacing:-.025em}
.desc{text-align:left;min-height:42px}
.price{font-size:22px;letter-spacing:-.025em}
.qty{border-radius:12px}
.qty button{transition:background-color .16s ease}
.qty button:hover{background:var(--cream);}
.add{min-height:44px;border-radius:12px;box-shadow:0 5px 12px rgba(179,11,46,.15)}
.add:hover{transform:translateY(-1px);box-shadow:0 8px 16px rgba(179,11,46,.22)}

.modal{border-radius:20px;box-shadow:0 28px 72px rgba(40,15,5,.3)}
.modalhead{padding-bottom:14px;border-bottom:1px solid var(--border)}
.modalhead h2{letter-spacing:-.035em}
.item{border-radius:12px;transition:background-color .16s ease}
.item:hover{background:#fffaf6}
.total{font-size:23px}
.form h3{letter-spacing:-.025em}
.finish{min-height:52px;border-radius:13px;box-shadow:0 7px 16px rgba(179,11,46,.2)}
.finish:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(179,11,46,.25)}

@media(max-width:620px){
    .hero{padding:28px 15px 16px}
    .hero h1{font-size:32px}
    .hero p{font-size:14px}
    .product-search{height:45px;margin-top:17px;border-radius:12px}
    .products{padding-bottom:80px}
    .grid{gap:12px}
    .card{border-radius:15px}
    .photo{height:155px}
    .info{padding:12px}
    .name{font-size:15px;line-height:1.15}
    .desc{text-align:left;min-height:44px;line-height:1.35}
    .price{font-size:17px}
    .add{min-height:40px}
    .modal{max-height:92dvh;padding:19px 16px;border-radius:20px 20px 0 0}
    .overlay{align-items:flex-end;padding:0}
    .modalhead{position:sticky;top:-19px;z-index:2;background:var(--white);padding-top:19px}
    .finish{position:sticky;bottom:-19px;z-index:2;margin-bottom:-19px;padding-bottom:17px;background:var(--wine)}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>

<body>

<div id="cartToast" class="toast" role="status" aria-live="polite"></div>

<header>
    <div class="header">
        <a class="brand" href="#" aria-label="KUKI">
            <img src="images/logo-kuki-transparente.png" alt="KUKI Cookies">
        </a>

        <div class="header-actions">
            <button class="cart-top" id="topCartButton" type="button" onclick="openCart(); return false;" aria-label="Abrir carrinho e finalizar pedido">
                🛒 Finalizar pedido <span id="topCount">0</span>
            </button>
        </div>
    </div>
</header>

<section class="hero">
    <h1>Faça seu pedido</h1>
    <p>Escolha seus cookies favoritos e monte seu pedido em poucos toques.</p>
    <label class="product-search" for="productSearch">
        <span aria-hidden="true">⌕</span>
        <input id="productSearch" type="search" placeholder="Buscar um sabor" autocomplete="off" oninput="setProductSearch(this.value)">
    </label>
</section>

<div id="storeStatus" class="store-status" role="status"></div>

<main class="products">
    <div class="grid" id="products"></div>
</main>


<footer class="site-footer">
    <div class="footer-content">
        <a class="instagram-link"
           href="https://www.instagram.com/kukicookiees?igsi=ejd0dmI4Z2luMjI3"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram da KUKI - Kukicookiees">
            <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
            </svg>
            <span>Kukicookiees</span>
        </a>

        <button class="history-float" type="button" onclick="openHistory()">
            📋 MEUS PEDIDOS
        </button>
    </div>
</footer>

<div id="overlay" class="overlay" onclick="outside(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Meu pedido</h2>
            <button class="close" type="button" onclick="closeCart()">×</button>
        </div>

        <div id="items" class="items"></div>

        <div class="total">
            <span>Total</span>
            <span id="total">R$ 0,00</span>
        </div>

        <div class="form">
            <h3>Seus dados</h3>
            <div class="required-note">* Campos obrigatórios</div>

            <div class="group">
                <label for="phone">WhatsApp *</label>
                <input id="phone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel">
            </div>

            <div class="group">
                <label for="name">Nome *</label>
                <div class="hp-field" aria-hidden="true">
                    <label for="website">Deixe este campo vazio</label>
                    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <input id="name" type="text" placeholder="Digite seu nome" autocomplete="name">
            </div>

            <div class="group">
                <label for="payment">Forma de pagamento *</label>
                <select id="payment">
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="CARTAO">Cartão</option>
                </select>
            </div>
            <div class="group">
                <label for="observation">Observação</label>
                <textarea id="observation" rows="3" placeholder="Alguma observação?"></textarea>
            </div>

            <button id="finish" class="finish" type="button" onclick="finishOrder()">
                FINALIZAR PEDIDO
            </button>
        </div>
    </div>
</div>

<div id="historyOverlay" class="overlay" onclick="outsideHistory(
