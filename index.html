<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;
    --cream-3:#f5d7bd;
    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    height:290px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:20px}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:23px;
    letter-spacing:.4px;
    margin-bottom:8px;
    text-align:center;
}

.desc{
    color:var(--muted);
    min-height:44px;
    font-size:14px;
    line-height:1.45;
    margin-bottom:14px;
    text-align:center;
}

.price{
    color:var(--brown);
    font-size:24px;
    font-weight:900;
    margin-bottom:16px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

/* Feedback visual ao adicionar produto */
@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.cart-added-shake{
    animation:shake .45s ease;
}

.toast{
    position:fixed;
    left:50%;
    top:88px;
    transform:translateX(-50%) translateY(-20px);
    z-index:3000;
    background:var(--wine);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 12px 28px rgba(80,35,20,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:620px){
    .header{padding:10px 14px}
    .brand img{width:135px}
    .cart-top,.history-top{padding:11px 12px;font-size:12px}
    .header-actions{gap:6px}
    .hero{padding:32px 15px 14px}
    .products{padding:10px 15px 55px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .photo{height:185px}
    .photo img{padding:2px}
    .info{padding:11px}
    .name{font-size:15px;margin-bottom:6px}
    .desc{font-size:11px;min-height:48px;margin-bottom:8px}
    .price{font-size:16px;margin-bottom:10px}
    .actions{gap:6px;flex-direction:column}
    .qty{justify-content:center}
    .qty button{width:34px;height:36px}
    .add{min-height:38px;font-size:12px}
    .row{grid-template-columns:1fr}
    .modal{padding:20px}
}
