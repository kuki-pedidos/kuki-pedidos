<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUKI | Faça seu pedido</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8f1e9;
    color: #241713;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #eadbd0;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header {
    max-width: 1200px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cookie {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #d69b69;
    border: 4px solid #c88655;
    position: relative;
}

.cookie:before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #573326;
    top: 9px;
    left: 9px;
    box-shadow:
        18px 3px #573326,
        7px 18px #573326,
        25px 21px #573326;
}

.cookie:after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #573326;
    top: 30px;
    left: 16px;
    box-shadow: 15px -12px #573326;
}

.logo strong {
    display: block;
    font-size: 25px;
    letter-spacing: 2px;
}

.logo span {
    font-size: 13px;
    color: #756a65;
}

button {
    font-weight: bold;
    cursor: pointer;
}

.cart-top,
.cart-button,
.add,
.finish {
    background: #321c14;
    color: white;
    border: 0;
}

.cart-top {
    padding: 12px 18px;
    border-radius: 30px;
}

.hero {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px 20px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.hero p {
    color: #756a65;
}

.products {
    max-width: 1200px;
    margin: auto;
    padding: 10px 20px 120px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: #fff;
    border: 1px solid #eadbd0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(60,30,15,.06);
}

.photo {
    height: 220px;
    background: #f0e1d1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
}

.info {
    padding: 20px;
}

.name {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
}

.desc {
    color: #756a65;
    font-size: 14px;
    line-height: 1.45;
    min-height: 42px;
    margin-bottom: 15px;
}

.price {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 15px;
}

.actions {
    display: flex;
    gap: 8px;
}

.qty {
    display: flex;
    align-items: center;
    border: 1px solid #eadbd0;
    border-radius: 10px;
    overflow: hidden;
}

.qty button {
    width: 40px;
    height: 44px;
    border: 0;
    background: #fff;
    font-size: 20px;
}

.qty span {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

.add {
    flex: 1;
    border-radius: 10px;
}

.floating {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 200;
}

.cart-button {
    border-radius: 40px;
    padding: 16px 22px;
    box-shadow: 0 8px 25px rgba(50,28,20,.25);
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.overlay.active {
    display: flex;
}

.modal {
    background: #fff;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 25px;
}

.modalhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close {
    border: 0;
    background: #f4eee9;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 20px;
}

.items {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #756a65;
}

.item {
    border: 1px solid #eadbd0;
    border-radius: 14px;
    padding: 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
}

.itemname {
    font-weight: bold;
}

.itemprice {
    color: #756a65;
    font-size: 14px;
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.controls button {
    border: 1px solid #eadbd0;
    background: #fff;
    width: 30px;
    height: 30px;
    border-radius: 7px;
}

.remove {
    color: #a33 !important;
    border: 0 !important;
}

.total {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eadbd0;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
}

.form {
    margin-top: 25px;
}

.form h3 {
    margin-bottom: 15px;
}

.group {
    margin-bottom: 13px;
}

.group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.group input,
.group textarea,
.group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #eadbd0;
    border-radius: 9px;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.finish {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
}

.finish:disabled {
    opacity: .6;
    cursor: wait;
}

@media(max-width:850px) {
    .grid {
        grid-template-columns: repeat(2,1fr);
    }

    .hero h1 {
        font-size: 32px;
    }
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 28px;
    }

    .products {
        padding: 10px 15px 110px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .floating {
        right: 15px;
        bottom: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="logo">
            <div class="cookie"></div>

            <div>
                <strong>KUKI</strong>
                <span>Cookies Artesanais</span>
            </div>
        </div>

        <button class="cart-top" onclick="openCart()">
            🛒 Meu pedido
            <span id="topCount">0</span>
        </button>

    </div>
</header>


<section class="hero">

    <h1>Faça seu pedido 🍪</h1>

    <p>
        Escolha seus cookies favoritos e monte seu pedido.
    </p>

</section>


<main class="products">

    <div class="grid" id="products"></div>

</main>


<div class="floating">

    <button class="cart-button" onclick="openCart()">

        🛒 Ver pedido
        (<span id="floatCount">0</span>)

    </button>

</div>


<div id="overlay"
     class="overlay"
     onclick="outside(event)">

    <div class="modal">

        <div class="modalhead">

            <h2>Seu pedido</h2>

            <button
                class="close"
                onclick="closeCart()">

                ×

            </button>

        </div>


        <div
            id="items"
            class="items">
        </div>


        <div class="total">

            <span>Total</span>

            <span id="total">
                R$ 0,00
            </span>

        </div>


        <div class="form">

            <h3>Seus dados</h3>


            <div class="group">

                <label>Nome *</label>

                <input
                    id="name"
                    placeholder="Digite seu nome">

            </div>


            <div class="group">

                <label>WhatsApp *</label>

                <input
                    id="phone"
                    placeholder="(85) 99999-9999">

            </div>


            <div class="group">

                <label>Forma de pagamento</label>

                <select id="payment">

                    <option value="">
                        Selecione
                    </option>

                    <option value="PIX">
                        PIX
                    </option>

                    <option value="DINHEIRO">
                        Dinheiro
                    </option>

                    <option value="CARTAO">
                        Cartão
                    </option>

                </select>

            </div>


            <div class="group">

                <label>Tipo de entrega</label>

                <select id="delivery">

                    <option value="">
                        Selecione
                    </option>

                    <option value="ENTREGA">
                        Entrega
                    </option>

                    <option value="RETIRADA">
                        Retirada
                    </option>

                </select>

            </div>


            <div class="group">

                <label>Endereço</label>

                <input
                    id="address"
                    placeholder="Rua, avenida...">

            </div>


            <div class="row">

                <div class="group">

                    <label>Número</label>

                    <input
                        id="number"
                        placeholder="Número">

                </div>


                <div class="group">

                    <label>Bairro</label>

                    <input
                        id="neighborhood"
                        placeholder="Bairro">

                </div>

            </div>


            <div class="group">

                <label>Observação</label>

                <textarea
                    id="observation"
                    rows="3"
                    placeholder="Alguma observação?">
                </textarea>

            </div>


            <button
                id="finish"
                class="finish"
                onclick="finishOrder()">

                FINALIZAR PEDIDO

            </button>

        </div>

    </div>

</div>


<script>

const WEBHOOK_URL =
"https://rikasolucoes.app.n8n.cloud/webhook-test/kuki-pedido-site";


const products = [

    {
        id:"1",
        name:"TRADICIONAL",
        price:10.90,
        desc:"Chocolate ao leite e gotas de chocolate."
    },

    {
        id:"2",
        name:"RED",
        price:13.90,
        desc:"Massa vermelha com muito chocolate branco."
    },

    {
        id:"3",
        name:"BLACK",
        price:13.90,
        desc:"Massa 100% cacau com chocolate branco e ao leite."
    },

    {
        id:"4",
        name:"NUTELLA",
        price:15.90,
        desc:"Massa tradicional com muito recheio de Nutella."
    },

    {
        id:"5",
        name:"BUENO",
        price:17.90,
        desc:"Cookie com recheio cremoso e delicioso."
    },

    {
        id:"6",
        name:"CREAM",
        price:15.90,
        desc:"Cookie com recheio cremoso e sabor irresistível."
    }

];


let cart = {};


function money(value) {

    return value.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


function renderProducts() {

    document.getElementById("products").innerHTML =
    products.map(function(p) {

        return `

        <div class="card">

            <div class="photo">
                🍪
            </div>


            <div class="info">

                <div class="name">
                    ${p.name}
                </div>


                <div class="desc">
                    ${p.desc}
                </div>


                <div class="price">
                    ${money(p.price)}
                </div>


                <div class="actions">

                    <div class="qty">

                        <button
                            onclick="changeQty('${p.id}',-1)">
                            −
                        </button>


                        <span id="q${p.id}">
                            0
                        </span>


                        <button
                            onclick="changeQty('${p.id}',1)">
                            +
                        </button>

                    </div>


                    <button
                        class="add"
                        onclick="add('${p.id}')">

                        ADICIONAR

                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("");

}


function changeQty(id, amount) {

    const element =
        document.getElementById("q" + id);

    let value =
        parseInt(element.textContent) || 0;

    value += amount;

    if(value < 0) {
        value = 0;
    }

    element.textContent = value;

}


function add(id) {

    const quantity =
        parseInt(
            document.getElementById("q" + id).textContent
        ) || 0;


    if(quantity <= 0) {

        alert(
            "Escolha pelo menos 1 unidade."
        );

        return;

    }


    const product =
        products.find(function(p) {

            return p.id === id;

        });


    if(!cart[id]) {

        cart[id] = {
            ...product,
            quantity:0
        };

    }


    cart[id].quantity += quantity;


    document.getElementById(
        "q" + id
    ).textContent = 0;


    updateCart();

    openCart();

}


function changeCart(id, amount) {

    if(!cart[id]) {
        return;
    }


    cart[id].quantity += amount;


    if(cart[id].quantity <= 0) {

        delete cart[id];

    }


    updateCart();

}


function removeItem(id) {

    delete cart[id];

    updateCart();

}


function calculateTotal() {

    return Object.values(cart)
        .reduce(function(total,item) {

            return total +
                item.price *
                item.quantity;

        },0);

}


function calculateCount() {

    return Object.values(cart)
        .reduce(function(total,item) {

            return total +
                item.quantity;

        },0);

}


function updateCart() {

    const container =
        document.getElementById("items");

    const ids =
        Object.keys(cart);


    if(ids.length === 0) {

        container.innerHTML =
            '<div class="empty">Seu pedido está vazio.</div>';

    }

    else {

        container.innerHTML =
            ids.map(function(id) {

                const item =
                    cart[id];

                const subtotal =
                    item.price *
                    item.quantity;


                return `

                <div class="item">

                    <div>

                        <div class="itemname">
                            ${item.name}
                        </div>

                        <div class="itemprice">

                            ${item.quantity}
                            x
                            ${money(item.price)}
                            =
                            ${money(subtotal)}

                        </div>

                    </div>


                    <div class="controls">

                        <button
                            onclick="changeCart('${id}',-1)">
                            −
                        </button>


                        <strong>
                            ${item.quantity}
                        </strong>


                        <button
                            onclick="changeCart('${id}',1)">
                            +
                        </button>


                        <button
                            class="remove"
                            onclick="removeItem('${id}')">

                            🗑

                        </button>

                    </div>

                </div>

                `;

            }).join("");

    }


    document.getElementById(
        "total"
    ).textContent =
        money(calculateTotal());


    document.getElementById(
        "topCount"
    ).textContent =
        calculateCount();


    document.getElementById(
        "floatCount"
    ).textContent =
        calculateCount();

}


function openCart() {

    document
        .getElementById("overlay")
        .classList.add("active");

}


function closeCart() {

    document
        .getElementById("overlay")
        .classList.remove("active");

}


function outside(event) {

    if(event.target.id === "overlay") {

        closeCart();

    }

}


async function finishOrder() {


    if(Object.keys(cart).length === 0) {

        alert(
            "Adicione pelo menos um produto ao pedido."
        );

        return;

    }


    const name =
        document.getElementById("name")
        .value
        .trim();


    const phone =
        document.getElementById("phone")
        .value
        .trim();


    if(!name) {

        alert(
            "Digite seu nome."
        );

        return;

    }


    if(!phone) {

        alert(
            "Digite seu WhatsApp."
        );

        return;

    }


    const order = {

        origem:"SITE_KUKI",


        cliente: {

            nome:name,

            whatsapp:phone

        },


        itens:

            Object.values(cart)
            .map(function(item) {

                return {

                    produto_id:item.id,

                    produto:item.name,

                    quantidade:item.quantity,

                    preco_unitario:item.price,

                    valor_item:
                        item.price *
                        item.quantity

                };

            }),


        pagamento:
            document.getElementById(
                "payment"
            ).value,


        entrega:
            document.getElementById(
                "delivery"
            ).value,


        endereco:
            document.getElementById(
                "address"
            ).value.trim(),


        numero:
            document.getElementById(
                "number"
            ).value.trim(),


        bairro:
            document.getElementById(
                "neighborhood"
            ).value.trim(),


        observacao:
            document.getElementById(
                "observation"
            ).value.trim(),


        total:
            calculateTotal(),


        data:
            new Date().toISOString()

    };


    const button =
        document.getElementById("finish");


    button.disabled = true;

    button.textContent =
        "ENVIANDO PEDIDO...";


    try {


        const response =
            await fetch(

                WEBHOOK_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(order)

                }

            );


        if(!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        alert(
            "Pedido enviado com sucesso! 🍪\n\n" +
            "Obrigado, " +
            name +
            "!"
        );


        cart = {};

        updateCart();

        closeCart();


    }

    catch(error) {

        console.error(
            "Erro:",
            error
        );


        alert(
            "Não foi possível enviar o pedido.\n\n" +
            "Verifique sua conexão e tente novamente."
        );

    }


    finally {

        button.disabled = false;

        button.textContent =
            "FINALIZAR PEDIDO";

    }

}


renderProducts();

updateCart();

</script>

</body>
</html>
