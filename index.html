<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKI | Cookies Artesanais</title>

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;
    --cream-3:#f5d7bd;
    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
    padding-bottom:76px;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    height:290px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:20px}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:23px;
    letter-spacing:.4px;
    margin-bottom:8px;
    text-align:center;
}

.desc{
    color:var(--muted);
    min-height:44px;
    font-size:14px;
    line-height:1.45;
    margin-bottom:14px;
    text-align:center;
}

.price{
    color:var(--brown);
    font-size:24px;
    font-weight:900;
    margin-bottom:16px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.cart-added-shake{
    animation:shake .45s ease;
}

.toast{
    position:fixed;
    left:50%;
    top:88px;
    transform:translateX(-50%) translateY(-20px);
    z-index:3000;
    background:var(--wine);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 12px 28px rgba(80,35,20,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.site-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1500;
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(80,35,20,.10);
    padding:10px 22px;
}
.footer-content{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}
.history-float{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    background:var(--wine);
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(80,35,20,.20);
}
.history-float:hover{background:var(--wine-dark)}
.instagram-link{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--brown);
    font-size:15px;
    font-weight:800;
    text-decoration:none;
}
.instagram-link:hover{color:var(--wine)}
.instagram-icon{
    width:24px;
    height:24px;
    flex:0 0 24px;
}

.history-result{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.history-empty,.history-loading{
    padding:16px;
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--muted);
    text-align:center;
}
.order-history-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    background:#fff;
}
.order-history-head{margin-bottom:10px}
.order-history-number{
    color:var(--wine);
    font-weight:900;
    font-size:20px;
    letter-spacing:.4px;
}
.order-history-info{
    display:grid;
    gap:5px;
    color:var(--muted);
    font-size:15px;
    line-height:1.45;
}
.order-history-total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--cream-3);
    color:var(--brown);
    font-size:18px;
    font-weight:900;
}

.hp-field{
    position:absolute !important;
    left:-9999px !important;
    width:1px !important;
    height:1px !important;
    overflow:hidden !important;
    opacity:0 !important;
    pointer-events:none !important;
}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:620px){
    .header{padding:10px 14px}
    .brand img{width:135px}
    .cart-top{padding:11px 12px;font-size:12px}
    .hero{padding:32px 15px 14px}
    .products{padding:10px 15px 55px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .photo{height:185px}
    .photo img{padding:2px}
    .info{padding:11px}
    .name{font-size:15px;margin-bottom:6px}
    .desc{font-size:11px;min-height:48px;margin-bottom:8px}
    .price{font-size:16px;margin-bottom:10px}
    .actions{gap:6px;flex-direction:column}
    .qty{justify-content:center}
    .qty button{width:34px;height:36px}
    .add{min-height:38px;font-size:12px}
    .row{grid-template-columns:1fr}
    .modal{padding:20px}
    .site-footer{padding:9px 12px}
    .footer-content{gap:10px}
    .history-float{padding:13px 14px;font-size:12px;white-space:nowrap}
    .instagram-link{font-size:12px;gap:6px;white-space:nowrap}
    .instagram-icon{width:21px;height:21px;flex-basis:21px}
    body{padding-bottom:70px}
}
</style>
</head>

<body>

<div id="cartToast" class="toast" role="status" aria-live="polite"></div>

<header>
    <div class="header">
        <a class="brand" href="#" aria-label="KUKI">
            <img src="images/logo-kuki-transparente.png" alt="KUKI Cookies">
        </a>

        <div class="header-actions">
            <button class="cart-top" type="button" onclick="openCart()">
                🛒 Finalizar pedido <span id="topCount">0</span>
            </button>
        </div>
    </div>
</header>

<section class="hero">
    <h1>Faça seu pedido</h1>
    <p>Escolha seus cookies favoritos e monte seu pedido.</p>
</section>

<div id="storeStatus" class="store-status" role="status"></div>

<main class="products">
    <div class="grid" id="products"></div>
</main>

<footer class="site-footer">
    <div class="footer-content">
        <a class="instagram-link"
           href="https://www.instagram.com/kukicookiees?igsi=ejd0dmI4Z2luMjI3"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram da KUKI - Kukicookiees">
            <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
            </svg>
            <span>Kukicookiees</span>
        </a>

        <button class="history-float" type="button" onclick="openHistory()">
            📋 MEUS PEDIDOS
        </button>
    </div>
</footer>

<div id="overlay" class="overlay" onclick="outside(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Meu pedido</h2>
            <button class="close" type="button" onclick="closeCart()">×</button>
        </div>

        <div id="items" class="items"></div>

        <div class="total">
            <span>Total</span>
            <span id="total">R$ 0,00</span>
        </div>

        <div class="form">
            <h3>Seus dados</h3>
            <div class="required-note">* Campos obrigatórios</div>

            <div class="group">
                <label for="phone">WhatsApp *</label>
                <input id="phone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel" oninput="handlePhoneInput(this)">
            </div>

            <div class="group">
                <label for="name">Nome *</label>
                <div class="hp-field" aria-hidden="true">
                    <label for="website">Deixe este campo vazio</label>
                    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <input id="name" type="text" placeholder="Digite seu nome" autocomplete="name">
            </div>

            <div class="group">
                <label for="payment">Forma de pagamento *</label>
                <select id="payment">
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="CARTAO">Cartão</option>
                </select>
            </div>

            <div class="group">
                <label for="delivery">Tipo de entrega *</label>
                <select id="delivery">
                    <option value="">Selecione</option>
                    <option value="ENTREGA">Entrega</option>
                    <option value="RETIRADA">Retirada</option>
                </select>
            </div>

            <div class="group">
                <label for="observation">Observação</label>
                <textarea id="observation" rows="3" placeholder="Alguma observação?"></textarea>
            </div>

            <button id="finish" class="finish" type="button" onclick="finishOrder()">
                FINALIZAR PEDIDO
            </button>
        </div>
    </div>
</div>

<div id="paymentOverlay" class="overlay" onclick="outsidePayment(event)">
    <div class="modal" style="text-align:center;">
        <div class="modalhead">
            <h2 id="paymentModalTitle">Pagamento</h2>
            <button class="close" type="button" onclick="closePayment()">×</button>
        </div>
        <div id="paymentModalContent" style="padding: 10px 0;"></div>
    </div>
</div>

<div id="historyOverlay" class="overlay" onclick="outsideHistory(event)">
    <div class="modal">
        <div class="modalhead">
            <div>
                <h2>Meus pedidos</h2>
                <div class="required-note">Consulte seu histórico pelo WhatsApp cadastrado.</div>
            </div>
            <button class="close" type="button" onclick="closeHistory()">×</button>
        </div>

        <div class="group">
            <label for="historyPhone">WhatsApp</label>
            <input id="historyPhone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel">
        </div>

        <button id="searchHistory" class="finish" type="button" onclick="loadHistory()">CONSULTAR PEDIDOS</button>
        <div id="historyResult" class="history-result"></div>
    </div>
</div>

<script>
const WEBHOOK_URL = "https://n8n.rikasolucoes.com.br/webhook/kuki-pedido-site";
const HISTORY_WEBHOOK_URL = "https://n8n.rikasolucoes.com.br/webhook/kuki-historico-pedidos";

const SUPABASE_URL = "https://delakuvbbayovkpxemgm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FqBkrIbKuNSmh78DidDpow_30o7P4kP";

let products = [
    { id: "1", name: "TRADICIONAL", price: 10.90, desc: "Chocolate ao leite e gotas de chocolate", image: "images/tradicional.png", active: true },
    { id: "2", name: "RED", price: 13.90, desc: "Massa vermelha com muito chocolate branco", image: "images/red.png", active: true },
    { id: "3", name: "BLACK", price: 13.90, desc: "Massa 100% cacau com chocolate branco e chocolate ao leite", image: "images/black.png", active: true },
    { id: "4", name: "NUTELLA", price: 15.90, desc: "Massa tradicional com muito recheio de Nutella", image: "images/nutella.png", active: true },
    { id: "5", name: "BUENO", price: 17.90, desc: "Cookie com recheio cremoso e o delicioso sabor bueno", image: "images/bueno.png", active: true },
    { id: "6", name: "CREAM", price: 15.90, desc: "Cookie com recheio cremoso e sabor irresistível", image: "images/cream.png", active: true }
];

let cart = {};
let storeHours = null;
let storeHoursLoaded = false;
let storeHoursLoading = false;

// --- BUSCA AUTOMÁTICA DE CLIENTE PELO WHATSAPP ---
let phoneSearchTimeout = null;

function handlePhoneInput(input) {
    clearTimeout(phoneSearchTimeout);
    const digits = normalizePhone(input.value);

    // Se já tiver DDD + Número (10 ou 11 dígitos)
    if (digits.length >= 10 && digits.length <= 11) {
        phoneSearchTimeout = setTimeout(() => {
            fetchClientByPhone(digits);
        }, 500);
    }
}

async function fetchClientByPhone(phoneDigits) {
    try {
        const phoneFormatted = normalizePhoneForOrder(phoneDigits);
        const url = new URL(SUPABASE_URL + "/rest/v1/CLIENTES");
        url.searchParams.set("select", "NOME,nome");
        url.searchParams.set("or", `WHATSAPP.eq.${phoneFormatted},TELEFONE.eq.${phoneFormatted},whatsapp.eq.${phoneFormatted}`);

        const response = await fetch(url.toString(), {
            method: "GET",
            headers: {
                "Accept": "application/json",
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY
            }
        });

        if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
                const clientName = data[0].NOME || data[0].nome;
                if (clientName) {
                    const nameField = document.getElementById("name");
                    if (nameField && !nameField.value.trim()) {
                        nameField.value = clientName;
                    }
                }
            }
        }
    } catch (e) {
        console.error("Erro ao buscar cadastro de cliente:", e);
    }
}

// --- CONTROLE DE HORÁRIOS ---
const DAY_TO_NAME = { 0:"DOMINGO", 1:"SEGUNDA", 2:"TERÇA", 3:"QUARTA", 4:"QUINTA", 5:"SEXTA", 6:"SÁBADO" };

function normalizeDayName(value){
    return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();
}

function normalizeTime(value){
    if(!value) return "";
    const match = String(value).match(/^(\d{1,2}):(\d{2})/);
    return match ? String(match[1]).padStart(2,"0") + ":" + match[2] : "";
}

function getMinutes(time){
    const normalized = normalizeTime(time);
    if(!normalized) return 0;
    const [hour, minute] = normalized.split(":").map(Number);
    return hour * 60 + minute;
}

async function loadStoreHours(){
    if(storeHoursLoading) return;
    storeHoursLoading = true;
    try{
        const url = new URL(SUPABASE_URL + "/rest/v1/HORARIOS");
        url.searchParams.set("select", "*");
        const response = await fetch(url.toString(),{
            method:"GET",
            headers:{ "Accept":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
        });
        if(response.ok){
            const rows = await response.json();
            const map = {};
            (Array.isArray(rows) ? rows : []).forEach(row => {
                const dayName = normalizeDayName(row.DIA_SEMANA ?? row.dia_semana ?? row.dia);
                if(dayName){
                    map[dayName] = {
                        aberto: row.ABERTO ?? row.aberto,
                        abertura: normalizeTime(row.HORA_ABERTURA ?? row.hora_abertura),
                        fechamento: normalizeTime(row.HORA_FECHAMENTO ?? row.hora_fechamento)
                    };
                }
            });
            storeHours = map;
            storeHoursLoaded = true;
        }
    }catch(e){
        console.error("Erro ao carregar horários:", e);
    }finally{
        storeHoursLoading = false;
        updateStoreStatus();
    }
}

function updateStoreStatus(){
    const element = document.getElementById("storeStatus");
    if(!element) return;

    if(!storeHoursLoaded || !storeHours){
        element.textContent = "🟢 Faça seu pedido normalmente.";
        element.className = "store-status open";
        return;
    }

    const now = new Date();
    const dayName = normalizeDayName(DAY_TO_NAME[now.getDay()]);
    const schedule = storeHours[dayName];

    if(!schedule || !schedule.aberto){
        element.textContent = "🔴 Hoje a KUKI está fechada. Voltamos em breve com cookies fresquinhos! 🍪🤎";
        element.className = "store-status closed";
        return;
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const opening = getMinutes(schedule.abertura);
    const closing = getMinutes(schedule.fechamento);
    const isOpen = current >= opening && current < closing;

    element.textContent = isOpen 
        ? `🟢 Estamos abertos até ${schedule.fechamento} hs` 
        : `🔴 Estamos fechados no momento. Funcionamos hoje das ${schedule.abertura} hs às ${schedule.fechamento} hs.`;
    element.className = "store-status " + (isOpen ? "open" : "closed");
}

// --- DADOS DO SUPABASE ---
function rowValue(row, keys, fallback=""){
    for(const key of keys){
        if(row && row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== ""){
            return row[key];
        }
    }
    return fallback;
}

async function loadActiveTable(tableName){
    const url = new URL(SUPABASE_URL + "/rest/v1/" + tableName);
    url.searchParams.set("select", "*");
    url.searchParams.set("order", "id.asc");

    const response = await fetch(url.toString(), {
        method:"GET",
        headers:{ "Accept":"application/json", "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer " + SUPABASE_ANON_KEY }
    });

    if(!response.ok) return [];
    const rows = await response.json();
    return Array.isArray(rows) ? rows.filter(row => {
        const active = row.ATIVO ?? row.ativo;
        return active === undefined || active === null || active === true || String(active).toUpperCase() === "TRUE";
    }) : [];
}

async function loadProductsFromSupabase(){
    try{
        const rows = await loadActiveTable("PRODUTOS");
        if(rows.length){
            products = rows.map(row => ({
                id: String(rowValue(row,["id","ID","CODIGO"], "")),
                name: String(rowValue(row,["NOME","nome"], "PRODUTO")),
                price: Number(rowValue(row,["PRECO","preco","VALOR","valor"], 0)) || 0,
                desc: String(rowValue(row,["DESCRICAO","descricao"], "")),
                image: String(rowValue(row,["FOTO_URL","foto_url"], "") || ""),
                active: true
            }));
        }
    }catch(e){
        console.error("Erro ao carregar produtos:", e);
    }
    renderProducts();
}

function fillSelectOptions(selectId, rows, placeholder){
    const select = document.getElementById(selectId);
    if(!select) return;
    const current = select.value;
    const options = rows.map(row => {
        const name = String(rowValue(row,["NOME","nome","DESCRICAO","descricao"], "")).trim();
        return name ? `<option value="${name}">${name}</option>` : "";
    }).filter(Boolean).join("");

    select.innerHTML = `<option value="">${placeholder}</option>` + options;
    if(current) select.value = current;
}

async function loadPaymentAndDeliveryFromSupabase(){
    const [payments, deliveries] = await Promise.allSettled([
        loadActiveTable("FORMAS_PAGAMENTO"),
        loadActiveTable("FORMAS_ENTREGA")
    ]);
    if(payments.status === "fulfilled" && payments.value.length > 0) fillSelectOptions("payment", payments.value, "Selecione");
    if(deliveries.status === "fulfilled" && deliveries.value.length > 0) fillSelectOptions("delivery", deliveries.value, "Selecione");
}

// --- CARRINHO E INTERFACE ---
function money(val) {
    return val.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function renderProducts() {
    document.getElementById("products").innerHTML = products.filter(p => p.active).map(product => `
        <div class="card">
            <div class="photo"><img src="${product.image}" alt="${product.name}" loading="lazy"></div>
            <div class="info">
                <div class="name">${product.name}</div>
                <div class="desc">${product.desc}</div>
                <div class="price">${money(product.price)}</div>
                <div class="actions">
                    <div class="qty">
                        <button type="button" onclick="changeQty('${product.id}',-1)">−</button>
                        <span id="q${product.id}">0</span>
                        <button type="button" onclick="changeQty('${product.id}',1)">+</button>
                    </div>
                    <button type="button" class="add" onclick="add('${product.id}')">ADICIONAR</button>
                </div>
            </div>
        </div>
    `).join("");
}

function changeQty(id, amount) {
    const el = document.getElementById("q" + id);
    let val = (parseInt(el.textContent,10) || 0) + amount;
    el.textContent = val < 0 ? 0 : val;
}

function add(id) {
    const quantity = parseInt(document.getElementById("q" + id).textContent, 10) || 0;
    if(quantity <= 0){ alert("Escolha pelo menos 1 unidade."); return; }
    const product = products.find(item => item.id === id);
    if(!product) return;
    cart[id] = { ...product, quantity };
    updateCart();
    showAddedFeedback(product.name, quantity);
}

function changeCart(id, amount) {
    if(!cart[id]) return;
    cart[id].quantity += amount;
    if(cart[id].quantity <= 0) delete cart[id];
    updateCart();
}

function removeItem(id){
    delete cart[id];
    updateCart();
}

function calculateTotal(){
    return Object.values(cart).reduce((tot, item) => tot + item.price * item.quantity, 0);
}

function calculateCount(){
    return Object.values(cart).reduce((tot, item) => tot + item.quantity, 0);
}

function updateCart(){
    const container = document.getElementById("items");
    const ids = Object.keys(cart);

    if(ids.length === 0){
        container.innerHTML = '<div class="empty">Seu pedido está vazio.</div>';
    }else{
        container.innerHTML = ids.map(id => {
            const item = cart[id];
            return `
                <div class="item">
                    <div>
                        <div class="itemname">${item.name}</div>
                        <div class="itemprice">${item.quantity} x ${money(item.price)} = ${money(item.price * item.quantity)}</div>
                    </div>
                    <div class="controls">
                        <button type="button" onclick="changeCart('${id}',-1)">−</button>
                        <strong>${item.quantity}</strong>
                        <button type="button" onclick="changeCart('${id}',1)">+</button>
                        <button type="button" class="remove" onclick="removeItem('${id}')">🗑</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    document.getElementById("total").textContent = money(calculateTotal());
    document.getElementById("topCount").textContent = calculateCount();
}

function openCart(){
    document.getElementById("overlay").classList.add("active");
    const savedPhone = localStorage.getItem("kuki_whatsapp") || "";
    if(savedPhone && !document.getElementById("phone").value) {
        document.getElementById("phone").value = savedPhone;
        fetchClientByPhone(savedPhone);
    }
    updateCart();
}

function closeCart(){ document.getElementById("overlay").classList.remove("active"); }
function outside(e){ if(e.target.id === "overlay") closeCart(); }

function openPaymentModal(data){
    const container = document.getElementById("paymentModalContent");
    const title = document.getElementById("paymentModalTitle");

    if(data && (data.qr_code || data.pix_copia_e_cola)){
        const pixCode = data.qr_code || data.pix_copia_e_cola;
        title.textContent = "Pagamento via PIX";
        container.innerHTML = `
            <p style="margin-bottom:12px; color:var(--muted); font-size:15px;">Copie a chave Pix abaixo e pague no app do seu banco:</p>
            <textarea id="pixCodeInput" readonly style="width:100%; height:90px; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:12px; font-family:monospace; background:#f9e5d1; color:var(--text);">${pixCode}</textarea>
            <button type="button" class="finish" onclick="copyPixCode()" style="margin-top:14px; background:#167a3f;">COPIAR CHAVE PIX 📋</button>
        `;
    } else if(data && (data.checkout_url || data.init_point)){
        const checkoutUrl = data.checkout_url || data.init_point;
        title.textContent = "Pagamento";
        container.innerHTML = `
            <p style="margin-bottom:18px; color:var(--muted); font-size:15px;">Clique abaixo para concluir o pagamento no Mercado Pago:</p>
            <a href="${checkoutUrl}" target="_blank" class="finish" style="display:inline-block; text-decoration:none; background:#009ee3;">PAGAR COM MERCADO PAGO 💳</a>
        `;
    }
    document.getElementById("paymentOverlay").classList.add("active");
}

function copyPixCode(){
    const copyText = document.getElementById("pixCodeInput");
    if(copyText){
        copyText.select();
        navigator.clipboard.writeText(copyText.value).then(() => alert("Chave Pix copiada!"));
    }
}

function closePayment(){ document.getElementById("paymentOverlay").classList.remove("active"); }
function outsidePayment(e){ if(e.target.id === "paymentOverlay") closePayment(); }

function openHistory(){
    document.getElementById("historyOverlay").classList.add("active");
    const savedPhone = localStorage.getItem("kuki_whatsapp") || "";
    if(savedPhone) document.getElementById("historyPhone").value = savedPhone;
}
function closeHistory(){ document.getElementById("historyOverlay").classList.remove("active"); }
function outsideHistory(e){ if(e.target.id === "historyOverlay") closeHistory(); }

async function loadHistory(){
    const input = document.getElementById("historyPhone");
    const result = document.getElementById("historyResult");
    const phone = normalizePhoneForOrder(input.value);

    if(!isValidPhone(input.value)){ alert("Digite um WhatsApp válido."); return; }

    result.innerHTML = '<div class="history-loading">Buscando seus pedidos...</div>';
    try{
        const response = await fetch(HISTORY_WEBHOOK_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({telefone:phone, whatsapp:phone})
        });
        const data = await response.json();
        const orders = Array.isArray(data) ? data : (data.pedidos || data.data || []);
        
        if(!orders.length){
            result.innerHTML = '<div class="history-empty">Nenhum pedido encontrado.</div>';
            return;
        }

        result.innerHTML = orders.map(o => `
            <div class="order-history-card">
                <div class="order-history-number">${o.NUMERO_PEDIDO || o.id || "Pedido"}</div>
                <div class="order-history-info">Data: ${new Date(o.DATA || o.created_at).toLocaleString("pt-BR")}</div>
                <div class="order-history-total">Total: ${money(Number(o.VALOR_TOTAL || o.total || 0))}</div>
            </div>
        `).join("");
    }catch(e){
        result.innerHTML = '<div class="history-empty">Erro ao consultar. Tente novamente.</div>';
    }
}

function showAddedFeedback(name, quantity){
    const toast = document.getElementById("cartToast");
    if(toast){
        toast.textContent = `🍪 ${quantity}x ${name} adicionado ao carrinho!`;
        toast.classList.add("show");
        clearTimeout(window.cartToastTimer);
        window.cartToastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
}

function normalizePhone(phone){ return String(phone || "").replace(/\D/g,""); }

function normalizePhoneForOrder(phone){
    const digits = normalizePhone(phone);
    return (digits.startsWith("55") && (digits.length === 12 || digits.length === 13)) ? digits.substring(2) : digits;
}

function isValidPhone(phone){
    const digits = normalizePhone(phone);
    return digits.length >= 8 && digits.length <= 13;
}

// --- FINALIZAR PEDIDO (ENVIO PARA O N8N) ---
async function finishOrder(){
    const hp = document.getElementById("website");
    if(hp && hp.value.trim()) return; // Anti-bot

    if(Object.keys(cart).length === 0){
        alert("Adicione pelo menos um produto ao pedido.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const phoneInput = document.getElementById("phone").value.trim();
    const payment = document.getElementById("payment").value.trim();
    const delivery = document.getElementById("delivery").value.trim();
    const observation = document.getElementById("observation").value.trim();

    if(!phoneInput || !isValidPhone(phoneInput)){
        alert("Digite um WhatsApp válido com DDD.");
        document.getElementById("phone").focus();
        return;
    }

    if(!name){
        alert("Digite seu nome.");
        document.getElementById("name").focus();
        return;
    }

    if(!payment){ alert("Selecione a forma de pagamento."); return; }
    if(!delivery){ alert("Selecione o tipo de entrega."); return; }

    const phone = normalizePhoneForOrder(phoneInput);

    const orderPayload = {
        request_id: "kuki-" + Date.now(),
        origem: "SITE_KUKI",
        cliente: { nome: name, whatsapp: phone },
        itens: Object.values(cart).map(item => ({
            produto_id: item.id,
            produto: item.name,
            quantidade: item.quantity,
            preco_unitario: item.price,
            valor_item: item.price * item.quantity
        })),
        pagamento: payment,
        entrega: delivery,
        observacao: observation,
        total: calculateTotal(),
        data: new Date().toISOString()
    };

    const button = document.getElementById("finish");
    button.disabled = true;
    button.textContent = "ENVIANDO PEDIDO...";

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(orderPayload)
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const responseData = await response.json();
        localStorage.setItem("kuki_whatsapp", phone);

        cart = {};
        updateCart();
        closeCart();

        document.getElementById("observation").value = "";

        if (responseData && (responseData.qr_code || responseData.pix_copia_e_cola || responseData.checkout_url || responseData.init_point)) {
            openPaymentModal(responseData);
        } else {
            alert("Pedido enviado com sucesso! 🍪\n\nObrigado, " + name + "!");
        }

    } catch (error) {
        console.error("Erro no envio:", error);
        alert("Não foi possível enviar o pedido. Verifique sua conexão e tente novamente.");
    } finally {
        button.disabled = false;
        button.textContent = "FINALIZAR PEDIDO";
    }
}

// Inicialização
renderProducts();
updateCart();
updateStoreStatus();
loadProductsFromSupabase();
loadPaymentAndDeliveryFromSupabase();
loadStoreHours();
</script>
