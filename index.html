<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>KUKI | Cookies Artesanais</title>

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{

.header{

    gap:16px;

.brand{

}

.brand img{

}

.cart-top{
    border:0;

    color:#fff;

    padding:13px 20px;

    box-shadow:0 6px 16px rgba(179,11,46,.22);

}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;

}

.hero h1{

    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{

}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));

.card{

.card:hover{

.photo{

.photo img{

}

.info{padding:20px}

.name{

.desc{

.price{

.actions{

.qty{

}

.qty span{

}

.add{

.add:hover{background:var(--wine-dark)}

.overlay{

.overlay.active{display:flex}

.modal{

.controls{

.controls .remove{

<script>
let storeHours = null;
let storeHoursLoaded = false;
let storeHoursLoading = false;

const DAY_TO_NAME = {
    0:"DOMINGO",
    1:"SEGUNDA",
    2:"TERÇA",
    3:"QUARTA",
    4:"QUINTA",
    5:"SEXTA",
    6:"SÁBADO"
};

function normalizeDayName(value){
    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
}

function normalizeTime(value){
    if(value === undefined || value === null) return "";
    const match = String(value).match(/^(\d{1,2}):(\d{2})/);
    if(!match) return "";
    return String(match[1]).padStart(2,"0") + ":" + match[2];
}

function getMinutes(time){
    const normalized = normalizeTime(time);
    if(!normalized) return 0;
    const [hour, minute] = normalized.split(":").map(Number);
    return hour * 60 + minute;
}

function isOpenValue(value){
    return value === true ||
        value === 1 ||
        String(value || "").trim().toUpperCase() === "TRUE";
}

function getHoursRows(data){
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.horarios)) return data.horarios;
    if(data && Array.isArray(data.data)) return data.data;
    if(data && Array.isArray(data.body)) return data.body;
    return [];
}

function setStoreHours(data){
    const rows = getHoursRows(data);
    const map = {};

    rows.forEach(function(row){
        const dayName = normalizeDayName(
            row.DIA_SEMANA ?? row.dia_semana ?? row.dia
        );

        if(!dayName) return;

        map[dayName] = {
            aberto:isOpenValue(row.ABERTO ?? row.aberto),
            abertura:normalizeTime(row.HORA_ABERTURA ?? row.hora_abertura),
            fechamento:normalizeTime(row.HORA_FECHAMENTO ?? row.hora_fechamento)
        };
    });

    storeHours = map;
    storeHoursLoaded = Object.keys(map).length > 0;
    return storeHoursLoaded;
}

async function loadStoreHours(){
    if(storeHoursLoading) return;

    storeHoursLoading = true;

    try{
        const url = new URL(SUPABASE_URL + "/rest/v1/HORARIOS");
        url.searchParams.set("select", "*");

        const response = await fetch(url.toString(),{
            method:"GET",
            headers:{
                "Accept":"application/json",
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY
            }
        });

        if(!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();

        if(!setStoreHours(data)){
            throw new Error("Nenhum horário válido retornado.");
        }
    }catch(error){
        console.error("Erro ao carregar horários da loja:", error);
        storeHoursLoaded = false;
    }finally{
        storeHoursLoading = false;
        updateStoreStatus();
    }
}

function getStoreState(){
    if(!storeHoursLoaded || !storeHours){
        return {
            open:true, // Permite o fluxo caso ocorra erro na busca do banco
            loading:storeHoursLoading,
            message:storeHoursLoading
                ? "⏳ Consultando os horários da KUKI..."
                : "🟢 Faça seu pedido normalmente."
        };
    }

    const now = new Date();
    const dayName = normalizeDayName(DAY_TO_NAME[now.getDay()]);
    const schedule = storeHours[dayName];

    if(!schedule || !schedule.aberto){
        return {
            open:false,
            message:"🔴 Hoje a KUKI está fechada. Voltamos em breve com cookies fresquinhos! 🍪🤎"
        };
    }

    if(!schedule.abertura || !schedule.fechamento){
        return {
            open:false,
            message:"🔴 Os horários de hoje ainda não estão configurados."
        };
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const opening = getMinutes(schedule.abertura);
    const closing = getMinutes(schedule.fechamento);
    const isOpen = current >= opening && current < closing;

    return {
        open:isOpen,
        message:isOpen
            ? `🟢 Estamos abertos até ${schedule.fechamento} hs`
            : `🔴 Estamos fechados no momento. Funcionamos hoje das ${schedule.abertura} hs às ${schedule.fechamento} hs.`
    };
}

function updateStoreStatus(){
    const state = getStoreState();
    const element = document.getElementById("storeStatus");

    if(!element) return state;

    element.textContent = state.message;
    element.className = "store-status " + (state.open ? "open" : "closed");

    return state;
}

const WEBHOOK_URL = "https://n8n.rikasolucoes.com.br/webhook/kuki-pedido-site";
const HISTORY_WEBHOOK_URL = "https://n8n.rikasolucoes.com.br/webhook/kuki-historico-pedidos";

const SUPABASE_URL = "https://delakuvbbayovkpxemgm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FqBkrIbKuNSmh78DidDpow_30o7P4kP";
const CLIENTS_TABLE = "CLIENTES";

    { id: "1", name: "TRADICIONAL", price: 10.90, desc: "Chocolate ao leite e gotas de chocolate", image: "images/tradicional.png", active: true },

function isActiveValue(value){
    return value === true || value === 1 || String(value ?? "").trim().toUpperCase() === "TRUE";
}

function rowValue(row, keys, fallback=""){
    for(const key of keys){
        if(row && row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== ""){
            return row[key];
        }
    }
    return fallback;
}

async function loadActiveTable(tableName){
    const url = new URL(SUPABASE_URL + "/rest/v1/" + tableName);
    url.searchParams.set("select", "*");
    url.searchParams.set("order", "id.asc");

    const response = await fetch(url.toString(), {
        method:"GET",
        headers:{
            "Accept":"application/json",
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer " + SUPABASE_ANON_KEY
        }
    });

    if(!response.ok) throw new Error(tableName + " HTTP " + response.status);
    const rows = await response.json();
    return Array.isArray(rows)
        ? rows.filter(row => {
            const active = row.ATIVO ?? row.ativo;
            return active === undefined || active === null || isActiveValue(active);
        })
        : [];
}

async function loadProductsFromSupabase(){
    try{
        const rows = await loadActiveTable("PRODUTOS");
        if(rows.length){
            products = rows.map(row => ({
                id:String(rowValue(row,["id","ID","CODIGO"], "")),
                name:String(rowValue(row,["NOME","nome"], "PRODUTO")),
                price:Number(rowValue(row,["PRECO","preco","VALOR","valor"], 0)) || 0,
                desc:String(rowValue(row,["DESCRICAO","descricao"], "")),
                image:String(rowValue(row,["FOTO_URL","foto_url"], "") || ""),
                active:isActiveValue(row.ATIVO ?? row.ativo)
            }));
        }
    }catch(error){
        console.error("Erro ao carregar produtos do Supabase:", error);
    }
    renderProducts();
}

function fillSelectOptions(selectId, rows, placeholder){
    const select = document.getElementById(selectId);
    if(!select) return;

    const current = select.value;
    const options = rows.map(row => {
        const name = String(rowValue(row,["NOME","nome","DESCRICAO","descricao"], "")).trim();
        const value = name;
        if(!name) return "";
        return `<option value="${escapeOption(value)}">${escapeOption(name)}</option>`;
    }).filter(Boolean).join("");

    select.innerHTML = `<option value="">${placeholder}</option>` + options;
    if(current && [...select.options].some(o => o.value === current)) select.value = current;
}

function escapeOption(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

async function loadPaymentAndDeliveryFromSupabase(){
    const [paymentsResult, deliveriesResult] = await Promise.allSettled([
        loadActiveTable("FORMAS_PAGAMENTO"),
        loadActiveTable("FORMAS_ENTREGA")
    ]);

    if(paymentsResult.status === "fulfilled" && paymentsResult.value.length > 0){
        fillSelectOptions("payment", paymentsResult.value, "Selecione");
    }

    if(deliveriesResult.status === "fulfilled" && deliveriesResult.value.length > 0){
        fillSelectOptions("delivery", deliveriesResult.value, "Selecione");
    }
}

async function loadStoreData(){
    await Promise.all([
        loadProductsFromSupabase(),
        loadPaymentAndDeliveryFromSupabase()
    ]);
}

let cart = {};

function money(value) {
    return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function renderProducts() {
    const activeProducts = products.filter(item => item.active);

    document.getElementById("products").innerHTML =
        activeProducts.map(product => `
            <div class="card">
                <div class="photo">
                    <img src="${product.image}" alt="${product.name}" loading="lazy">
                </div>
                <div class="info">
                    <div class="name">${product.name}</div>
                    <div class="desc">${product.desc}</div>
                    <div class="price">${money(product.price)}</div>
                    <div class="actions">
                        <div class="qty">
                            <button type="button" onclick="changeQty('${product.id}',-1)">−</button>
                            <span id="q${product.id}">0</span>
                            <button type="button" onclick="changeQty('${product.id}',1)">+</button>
                        </div>
                        <button type="button" class="add" onclick="add('${product.id}')">ADICIONAR</button>
                    </div>
                </div>
            </div>
        `).join("");
}

function changeQty(id, amount) {
    const element = document.getElementById("q" + id);
    let value = parseInt(element.textContent,10) || 0;
    value += amount;
    if(value < 0) value = 0;
    element.textContent = value;
}

function add(id) {
    const quantity = parseInt(document.getElementById("q" + id).textContent, 10) || 0;
    if(quantity <= 0){
        alert("Escolha pelo menos 1 unidade.");
        return;
    }
    const product = products.find(item => item.id === id);
    if(!product){
        alert("Produto não encontrado.");
        return;
    }
    cart[id] = { ...product, quantity: quantity };
    updateCart();
    showAddedFeedback(product.name, quantity);
}

function changeCart(id, amount) {
    if(!cart[id]) return;
    cart[id].quantity += amount;
    if(cart[id].quantity <= 0) delete cart[id];
    updateCart();
}

function removeItem(id){
    delete cart[id];
    updateCart();
}

function calculateTotal(){
    return Object.values(cart).reduce((total,item) => total + item.price * item.quantity, 0);
}

function calculateCount(){
    return Object.values(cart).reduce((total,item) => total + item.quantity, 0);
}

function updateCart(){
    const container = document.getElementById("items");
    const ids = Object.keys(cart);

    if(ids.length === 0){
        container.innerHTML = '<div class="empty">Seu pedido está vazio.</div>';
    }else{
        container.innerHTML = ids.map(id => {
            const item = cart[id];
            const subtotal = item.price * item.quantity;
            return `
                <div class="item">
                    <div>
                        <div class="itemname">${item.name}</div>
                        <div class="itemprice">${item.quantity} x ${money(item.price)} = ${money(subtotal)}</div>
                    </div>
                    <div class="controls">
                        <button type="button" onclick="changeCart('${id}',-1)">−</button>
                        <strong>${item.quantity}</strong>
                        <button type="button" onclick="changeCart('${id}',1)">+</button>
                        <button type="button" class="remove" onclick="removeItem('${id}')">🗑</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    document.getElementById("total").textContent = money(calculateTotal());
    document.getElementById("topCount").textContent = calculateCount();

    products.forEach(product => {
        const quantityElement = document.getElementById("q" + product.id);
        if(quantityElement){
            quantityElement.textContent = cart[product.id] ? cart[product.id].quantity : 0;
        }
    });
}

function openCart(){
    document.getElementById("overlay").classList.add("active");
    updateCart();
}

function closeCart(){
    document.getElementById("overlay").classList.remove("active");
}

function outside(event){
    if(event.target.id === "overlay") closeCart();
}

function copyPixCode(){
    const copyText = document.getElementById("pixCodeInput");
    if(copyText){
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("Chave Pix copiada para a área de transferência!");
        }).catch(() => {
            alert("Copie a chave manualmente da caixa de texto.");
        });
    }
}

function closePayment(){
    document.getElementById("paymentOverlay").classList.remove("active");
}

function outsidePayment(event){
    if(event.target.id === "paymentOverlay") closePayment();
}

function normalizePhone(phone){
    return String(phone || "").replace(/\D/g,"");
}

function normalizePhoneForOrder(phone){
    const digits = normalizePhone(phone);
    if(digits.startsWith("55") && (digits.length === 12 || digits.length === 13)){
        return digits.substring(2);
    }
    return digits;
}

function isValidPhone(phone){
    const digits = normalizePhone(phone);
    return digits.length >= 8 && digits.length <= 13;
}

function openHistory(){
    document.getElementById("historyOverlay").classList.add("active");
    document.getElementById("historyResult").innerHTML = "";
    const savedPhone = localStorage.getItem("kuki_whatsapp") || "";
    if(savedPhone) document.getElementById("historyPhone").value = savedPhone;
}

function closeHistory(){
    document.getElementById("historyOverlay").classList.remove("active");
}

function outsideHistory(event){
    if(event.target.id === "historyOverlay") closeHistory();
}

function formatHistoryDate(value){
    if(!value) return "Data não informada";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("pt-BR");
}

function getHistoryOrders(data){
    if(Array.isArray(data)) return data;
    if(Array.isArray(data && data.pedidos)) return data.pedidos;
    if(Array.isArray(data && data.data)) return data.data;
    if(Array.isArray(data && data.body)) return data.body;
    return [];
}

function renderHistory(orders){
    const container = document.getElementById("historyResult");

    if(!orders.length){
        container.innerHTML = '<div class="history-empty">Nenhum pedido encontrado para este WhatsApp.</div>';
        return;
    }

    container.innerHTML = orders.map(order => {
        const total = Number(order.VALOR_TOTAL ?? order.valor_total ?? order.total ?? 0);
        const number = order.NUMERO_PEDIDO || order.numero_pedido || order.ID || order.id || "Pedido";
        const date = order.DATA || order.data || order.created_at;

        return `<div class="order-history-card">
            <div class="order-history-head">
                <div class="order-history-number">${number}</div>
            </div>
            <div class="order-history-info">
                <div><strong>Data:</strong> ${formatHistoryDate(date)}</div>
            </div>
            <div class="order-history-total">Total: ${money(total)}</div>
        </div>`;
    }).join("");
}

async function loadHistory(){
    const input = document.getElementById("historyPhone");
    const result = document.getElementById("historyResult");
    const button = document.getElementById("searchHistory");
    const phoneInput = input.value.trim();
    if(!phoneInput || !isValidPhone(phoneInput)){
        alert("Digite um WhatsApp válido.");
        input.focus();
        return;
    }
    const phone = normalizePhoneForOrder(phoneInput);
    localStorage.setItem("kuki_whatsapp", phone);
    button.disabled = true;
    button.textContent = "CONSULTANDO...";
    result.innerHTML = '<div class="history-loading">Buscando seus pedidos...</div>';
    try{
        const response = await fetch(HISTORY_WEBHOOK_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({telefone:phone, whatsapp:phone})
        });
        if(!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        renderHistory(getHistoryOrders(data));
    }catch(error){
        console.error("Erro ao consultar histórico:", error);
        result.innerHTML = '<div class="history-empty">Não foi possível consultar os pedidos agora. Tente novamente.</div>';
    }finally{
        button.disabled = false;
        button.textContent = "CONSULTAR PEDIDOS";
    }
}

function showAddedFeedback(productName, quantity){
    const cartButton = document.querySelector(".cart-top");
    const toast = document.getElementById("cartToast");

    if(cartButton){
        cartButton.classList.remove("cart-added-shake");
        void cartButton.offsetWidth;
        cartButton.classList.add("cart-added-shake");
    }

    if(toast){
        const unitText = quantity === 1 ? "unidade" : "unidades";
        toast.textContent = `🍪 ${quantity} ${unitText} de ${productName} adicionado${quantity === 1 ? "" : "s"} ao carrinho!`;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");

        clearTimeout(window.cartToastTimer);
        window.cartToastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
}

const SECURITY = {
    ORDER_COOLDOWN_MS: 3000,
    MAX_NAME_LENGTH: 80,
    MAX_TEXT_LENGTH: 300
};

let lastOrderAttemptAt = 0;

function sanitizeText(value, maxLength){
    return String(value ?? "")
        .replace(/[\u0000-\u001F\u007F]/g, " ")
        .replace(/[<>]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, maxLength);
}

function isBotSubmission(){
    const hp = document.getElementById("website");
    return !!(hp && hp.value.trim());
}

function makeRequestId(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }
    return "kuki-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function cleanCheckoutFields(){
    const name = document.getElementById("name");
    if(name) name.value = sanitizeText(name.value, SECURITY.MAX_NAME_LENGTH);

    const observation = document.getElementById("observation");
    if(observation) observation.value = sanitizeText(observation.value, SECURITY.MAX_TEXT_LENGTH);
}

async function finishOrder(){
    cleanCheckoutFields();

    if(isBotSubmission()){
        console.warn("Envio bloqueado pelo guard rail anti-bot.");
        return;
    }

    const now = Date.now();
    if(now - lastOrderAttemptAt < SECURITY.ORDER_COOLDOWN_MS){
        alert("Aguarde alguns segundos antes de enviar novamente.");
        return;
    }

    if(Object.keys(cart).length === 0){
        alert("Adicione pelo menos um produto ao pedido.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const phoneInput = document.getElementById("phone").value.trim();
    const payment = document.getElementById("payment").value.trim();
    const delivery = document.getElementById("delivery").value.trim();
    const observation = document.getElementById("observation").value.trim();

    if(!phoneInput){
        alert("Digite seu WhatsApp.");
        document.getElementById("phone").focus();
        return;
    }

    if(!isValidPhone(phoneInput)){
        alert("Digite um WhatsApp válido com DDD.");
        document.getElementById("phone").focus();
        return;
    }

    if(!name){
        alert("Digite seu nome.");
        document.getElementById("name").focus();
        return;
    }

    if(!payment){
        alert("Selecione a forma de pagamento.");
        document.getElementById("payment").focus();
        return;
    }

    if(!delivery){
        alert("Selecione o tipo de entrega.");
        document.getElementById("delivery").focus();
        return;
    }

    const phone = normalizePhoneForOrder(phoneInput);

    const order = {
        request_id: makeRequestId(),
        origem: "SITE_KUKI",

        cliente:{
            nome:name,
            whatsapp:phone
        },

        itens:Object.values(cart).map(item => ({
            produto_id:item.id,
            produto:item.name,
            quantidade:item.quantity,
            preco_unitario:item.price,
            valor_item:item.price * item.quantity
        })),

        pagamento:payment,
        entrega:delivery,
        observacao:observation,
        total:calculateTotal(),
        data:new Date().toISOString()
    };

    const button = document.getElementById("finish");

    lastOrderAttemptAt = Date.now();
    button.disabled = true;
    button.textContent = "ENVIANDO PEDIDO...";

    try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        const response = await fetch(
            WEBHOOK_URL,
            {
                method:"POST",
                signal:controller.signal,
                headers:{
                    "Content-Type":"application/json",
                    "X-Requested-With":"KUKI-SITE"
                },
                body:JSON.stringify(order)
            }
        );

        clearTimeout(timeout);

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const responseData = await response.json();
        localStorage.setItem("kuki_whatsapp", phone);

        cart = {};
        updateCart();
        closeCart();

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("payment").value = "";
        document.getElementById("delivery").value = "";
        document.getElementById("observation").value = "";

        if (responseData && (responseData.qr_code || responseData.pix_copia_e_cola || responseData.checkout_url || responseData.init_point)) {
            openPaymentModal(responseData);
        } else {
            alert("Pedido enviado com sucesso! 🍪\n\nObrigado, " + name + "!");
        }

    }catch(error){
        console.error("Erro ao enviar pedido:", error);
        alert("Não foi possível enviar o pedido.\n\nVerifique sua conexão e tente novamente.");
    }finally{
        button.disabled = false;
        button.textContent = "FINALIZAR PEDIDO";
    }
}
